[package]
name = "yukibana-instrument"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"] }
wasm-encoder = { version = "0.262.0", features = ["wasmparser"] }
wasmparser = "0.262.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
