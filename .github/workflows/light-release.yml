# Builds Yukibana Light (light) with every language pack and makes the
# archive yukibana-light/{build/, serve.py, README.md, RUN.txt}: the app,
# built, with every pack in it, and a server that sends the headers it
# wants.
#
# Pushing a light-v* tag publishes it as the GitHub release of that tag,
# with packs.json, which says what every pack in it was made from (the
# toolchain key of a split pack, the git tree id of light/packs/<pack> of
# any other), and toolchains.json, the split packs' toolchain keys alone.
# Run by hand (Actions, "Run workflow"), it only uploads the archive as the
# run's artifact yukibana-light-preview-<run number>.
#
# The packs come from light-packs.yml, reused with `upload`, and from nowhere
# else: this workflow never fetches, assembles or builds a pack itself. There
# a split pack is assembled from its stored toolchain and tested, and fails
# by name when the store lacks it (a release never builds a compiler); an
# unsplit pack is downloaded from the pack store when its sources have been
# built before, and built and tested only otherwise. So the bytes those tests
# passed are the bytes shipped, and a release whose packs are all built
# takes minutes. The assemble job puts the packs in app/static/packs, builds
# the app, type-checks it, smoke-tests the built app in Chromium and makes
# the archive.
name: Yukibana Light release

on:
  workflow_dispatch:
  push:
    tags:
      - light-v*

# A second run of the same ref waits for the first rather than cancelling
# it: a run that finishes leaves its packs for the next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  packs:
    name: Packs
    uses: ./.github/workflows/light-packs.yml
    with:
      upload: true
    permissions:
      contents: write # the pack store
      actions: write # the Haskell pack's inputs; pruning the build caches

  assemble:
    name: Assemble the archive
    needs: packs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: light/app
    steps:
      - uses: actions/checkout@v7

      # 24: setup-node's npm cache runs npm at the repository root, whose
      # package.json (the IDE's) requires Node 24 (devEngines).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: light/app/package-lock.json

      - name: Install the app's dependencies
        run: npm ci --no-audit --no-fund

      # Every pack-<pack> artifact's root is static/packs holding <pack>/,
      # so all of them merge into one static/packs. What each pack was made
      # from is the artifact toolchain-key-<pack>, which pack-* never
      # matches.
      - uses: actions/download-artifact@v7
        with:
          pattern: pack-*
          merge-multiple: true
          path: light/app/static/packs

      # What each pack was made from, as the pack job wrote it: one file
      # per pack, $RUNNER_TEMP/keys/<pack>, holding `toolchain <key>` or
      # `tree <tree id>`.
      - uses: actions/download-artifact@v7
        with:
          pattern: toolchain-key-*
          merge-multiple: true
          path: ${{ runner.temp }}/keys

      # Every pack in the tree (a directory with a build.sh, as the pack
      # workflow's matrix has it), so a new pack needs no edit here. Each
      # problem is named before the step fails, not only the first.
      - name: Packs
        run: |
          missing=()
          for d in ../packs/*/build.sh; do
            p=$(basename "$(dirname "$d")")
            [ -f "static/packs/$p/server.js" ] || missing+=("$p has no server.js")
            key="$RUNNER_TEMP/keys/$p"
            if [ ! -f "$key" ]; then
              missing+=("$p has no key file (toolchain-key-$p)")
            elif ! grep -Eqx '(toolchain|tree) [0-9a-f]{40,64}' "$key"; then
              missing+=("$p's key file is not 'toolchain <key>' or 'tree <id>': $(head -c 200 "$key")")
            else
              echo "$p: $(du -sh "static/packs/$p" | cut -f1), $(cat "$key")"
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::pack %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Smoke test (JavaScript, in the built app)
        run: node tests/e2e.mjs javascript

      - name: Lay out the archive
        run: |
          root="$RUNNER_TEMP/release/yukibana-light"
          mkdir -p "$root"
          mv build "$root/build"
          cp ../serve.py ../README.md "$root/"
          printf 'python3 serve.py build --port 8080\nthen open http://localhost:8080/\n' > "$root/RUN.txt"
          # packs.json ({<pack>: {"toolchain": <key>} | {"tree": <id>}}) and
          # toolchains.json ({<pack>: <key>}, split packs only) record what
          # the reused pack job actually used, from its key files; they are
          # never recomputed here, where a different checkout or script could
          # disagree with what was shipped. Nothing prunes light-toolchains
          # today; a future pruning must keep every key a published
          # toolchains.json names, so a release can be rebuilt (D6).
          for d in ../packs/*/build.sh; do
            p=$(basename "$(dirname "$d")")
            read -r kind value < "$RUNNER_TEMP/keys/$p"
            printf '%s\t%s\t%s\n' "$p" "$kind" "$value"
          done > "$RUNNER_TEMP/keys.tsv"
          jq -R -n '[inputs | split("\t") | {key: .[0], value: {(.[1]): .[2]}}] | from_entries' \
            < "$RUNNER_TEMP/keys.tsv" > "$root/packs.json"
          jq -R -n '[inputs | split("\t") | select(.[1] == "toolchain") | {key: .[0], value: .[2]}] | from_entries' \
            < "$RUNNER_TEMP/keys.tsv" > "$root/toolchains.json"
          jq . "$root/packs.json"
          du -sh "$root"
          find "$root" -type f | wc -l

      # The artifact's root is release/, so the downloaded zip holds
      # yukibana-light/. Level 0: the packs are .wasm with .br and .gz
      # siblings already, and zipping them again buys little.
      - uses: actions/upload-artifact@v6
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/light-v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: release

      # A zip, which every system opens; level 0, as the packs are .wasm with
      # .br and .gz siblings already. GitHub takes assets up to 2 GB.
      - name: Archive
        working-directory: release
        run: |
          zip -q -r -0 "../yukibana-light-$GITHUB_REF_NAME.zip" yukibana-light
          cp yukibana-light/packs.json yukibana-light/toolchains.json ../
          ls -l ../yukibana-light-*.zip
          size=$(stat -c %s "../yukibana-light-$GITHUB_REF_NAME.zip")
          [ "$size" -lt 2000000000 ] || { echo "::error::the archive is $size bytes, over GitHub's 2 GB per asset" >&2; exit 1; }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Yukibana Light with every language pack, built from $GITHUB_SHA by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Unzip \`yukibana-light-$GITHUB_REF_NAME.zip\`, then \`python3 serve.py build --port 8080\` in \`yukibana-light/\` and open http://localhost:8080/ (RUN.txt). \`packs.json\` gives what each pack was made from: the toolchain key it was assembled from (\`toolchain\`), or the git tree id of \`light/packs/<pack>\` it was built from (\`tree\`). \`toolchains.json\` gives the toolchain keys alone: each is the asset \`toolchain-<pack>-<key>.tar.zst\` of the \`light-toolchains\` prerelease.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Yukibana Light $GITHUB_REF_NAME" --notes-file notes.md \
            "yukibana-light-$GITHUB_REF_NAME.zip" packs.json toolchains.json

  # The release goes live at https://light.yukibana.dev (light/deploy): the
  # archive's build/ is the Worker's assets, and the pack files too big for
  # an asset go to its R2 bucket first. The token is the "light" environment's
  # secret, so only this job sees it; without one, the job says so and stops.
  deploy:
    name: Deploy to light.yukibana.dev
    if: startsWith(github.ref, 'refs/tags/light-v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: light
      url: https://light.yukibana.dev
    concurrency:
      group: light-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: light
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v7
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/release

      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the light environment: not deployed"
            exit 0
          fi
          mv "$RUNNER_TEMP/release/yukibana-light/build" app/build
          ./deploy/deploy.sh
