# Builds Yukibana Light (light) with every language pack and makes the
# archive yukibana-light/{build/, serve.py, README.md, RUN.txt}: the app,
# built, with every pack in it, and a server that sends the headers it
# wants.
#
# Pushing a light-v* tag publishes it as the GitHub release of that tag,
# with packs.json, which says what every pack in it was made from (the key
# of each toolchain unit of a split pack, the git tree id of
# light/packs/<pack> of any other), and toolchains.json, the units' keys
# alone.
# Run by hand (Actions, "Run workflow"), it only uploads the archive as the
# run's artifact yukibana-light-preview-<run number>.
#
# A light-v* tag, a push to main that changes Light, and a finished green
# run of light-packs.yml on main each deploy the archive to
# https://light.yukibana.dev (the deploy job); the GitHub release stays the
# tags' alone. Until Light merged into main (#71) the branch yukibana-light
# deployed instead. A deploy from main never builds a pack: its packs run
# passes `stored`, and a pack whose sources the store lacks ships as the
# store's newest build of that pack, said in the run's summary (the deploy
# rule in light-packs.yml). A push that changes a pack starts light-packs.yml
# too, which builds and stores it, for hours when a compiler changed; the
# push's own deploy ships the store's older build meanwhile (or fails by
# name, for a split pack whose new unit is not stored yet), and the deploy
# that light-packs.yml's green run starts (workflow_run) ships the new one.
# The `paths` filter keeps pushes that change nothing of Light's from
# deploying; GitHub never applies it to a tag. A workflow_run run checks out
# main as it is then, so it ships main's newest commit.
#
# A light-v* release is immutable once published (assets and tag), under a
# tag ruleset that keeps light-v* tags from moving or being deleted; a
# repository admin turns both on once with light/scripts/protect-releases.sh.
#
# The packs come from light-packs.yml, reused with `upload`, and from nowhere
# else: this workflow never fetches, assembles or builds a pack itself. There
# a split pack is assembled from its stored units and its tests (its
# test.sh) run over the pack as assembled, and it fails by name when the
# store lacks a unit (a release never builds a compiler); an
# unsplit pack is downloaded from the pack store when its sources have been
# built before, and built and tested only otherwise. So the bytes those tests
# passed are the bytes shipped, and a release whose packs are all built
# takes as long as the split packs' tests (cpp's, about 18 minutes). The
# assemble job puts the packs in app/static/packs, builds
# the app, type-checks it, smoke-tests the built app in Chromium and makes
# the archive.
name: Yukibana Light release

on:
  workflow_dispatch:
  push:
    tags:
      - light-v*
    branches:
      - main
    paths:
      - light/**
      - .github/workflows/light-release.yml
      - .github/workflows/light-packs.yml
      - .github/workflows/light-toolchain-unit.yml
      - .github/actions/once/**
  workflow_run:
    workflows:
      - Yukibana Light packs
    types:
      - completed
    branches:
      - main

# A second run of the same ref waits for the first rather than cancelling
# it: a run that finishes leaves its packs for the next. GitHub keeps one
# waiting run per group, so of several pushes in a row only the newest
# waits, and the ones it replaces are never deployed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  packs:
    name: Packs
    # A light-packs.yml run on main that failed stored nothing new: nothing
    # to deploy.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/light-packs.yml
    with:
      upload: true
      # A deploy from main ships what the store has and builds no pack; a
      # tag and a run by hand ship this commit's packs, built if need be.
      stored: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_run' }}
    # A called workflow's jobs may ask for no more than its caller grants,
    # whether or not they run, so this is the most any job of light-packs.yml
    # asks for. The jobs that write (store-units, store-packs, caches) run
    # only on main and never with `upload`, and the wave jobs, which sign,
    # never with `upload` either: a release run reads the stores, verifying
    # every toolchain, and writes nothing.
    permissions:
      contents: write
      actions: write
      attestations: write
      id-token: write

  assemble:
    name: Assemble the archive
    needs: packs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: light/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 24: setup-node's npm cache runs npm at the repository root, whose
      # package.json (the IDE's) requires Node 24 (devEngines).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: light/app/package-lock.json

      - name: Install the app's dependencies
        run: npm ci --no-audit --no-fund

      # Every pack-<pack> artifact's root is static/packs holding <pack>/,
      # so all of them merge into one static/packs. What each pack was made
      # from is the artifact toolchain-key-<pack>, which pack-* never
      # matches.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: pack-*
          merge-multiple: true
          path: light/app/static/packs

      # What each pack was made from, as the pack or assemble job wrote it:
      # one file per pack, $RUNNER_TEMP/keys/<pack>, holding `tree <tree id>`,
      # or one line `toolchain <pack>/<unit> <key>` per unit.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: toolchain-key-*
          merge-multiple: true
          path: ${{ runner.temp }}/keys

      # Every pack in the tree (a directory with a build.sh, as the pack
      # workflow's matrix has it), so a new pack needs no edit here. Each
      # problem is named before the step fails, not only the first. A pack
      # whose tree is not this commit's (a deploy's newest stored build) is
      # listed in the run's summary, so what went live is said where it is
      # seen.
      - name: Packs
        run: |
          missing=()
          for d in ../packs/*/build.sh; do
            p=$(basename "$(dirname "$d")")
            [ -f "static/packs/$p/server.js" ] || missing+=("$p has no server.js")
            key="$RUNNER_TEMP/keys/$p"
            if [ ! -f "$key" ]; then
              missing+=("$p has no key file (toolchain-key-$p)")
            elif ! { [ "$(wc -l < "$key")" -eq 1 ] && grep -Eqx 'tree [0-9a-f]{40,64}' "$key"; } &&
              ! { [ -s "$key" ] && ! grep -Evqx "toolchain $p/[a-z][a-z0-9]*(-[a-z0-9]+)* [0-9a-f]{40}" "$key"; }; then
              missing+=("$p's key file is neither 'tree <id>' nor lines 'toolchain $p/<unit> <key>': $(head -c 200 "$key")")
            else
              echo "$p: $(du -sh "static/packs/$p" | cut -f1), $(cat "$key")"
              read -r kind tree _ < "$key"
              head="$(git rev-parse "HEAD:light/packs/$p")"
              if [ "$kind" = tree ] && [ "$tree" != "$head" ]; then
                echo "- $p: the stored build of tree $tree, not this commit's ($head)" >> "$RUNNER_TEMP/older"
              fi
            fi
          done
          if [ -s "$RUNNER_TEMP/older" ]; then
            {
              echo "### Packs not built from this commit"
              cat "$RUNNER_TEMP/older"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::pack %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Smoke test (JavaScript, in the built app)
        run: node tests/e2e.mjs javascript

      - name: Lay out the archive
        run: |
          root="$RUNNER_TEMP/release/yukibana-light"
          mkdir -p "$root"
          mv build "$root/build"
          cp ../serve.py ../README.md "$root/"
          printf 'python3 serve.py build --port 8080\nthen open http://localhost:8080/\n' > "$root/RUN.txt"
          # packs.json ({<pack>: {"tree": <id>} | {"toolchains": {<unit>:
          # <key>}}}) and toolchains.json ({"<pack>/<unit>": <key>}, split
          # packs' units only) record what
          # the reused pack job actually used, from its key files; they are
          # never recomputed here, where a different checkout or script could
          # disagree with what was shipped. Nothing prunes light-toolchains
          # today; a future pruning must keep every key a published
          # toolchains.json names, so a release can be rebuilt (D6).
          for d in ../packs/*/build.sh; do
            p=$(basename "$(dirname "$d")")
            while read -r kind a b; do
              printf '%s\t%s\t%s\t%s\n' "$p" "$kind" "$a" "${b:-}"
            done < "$RUNNER_TEMP/keys/$p"
          done > "$RUNNER_TEMP/keys.tsv"
          jq -R -n 'reduce (inputs | split("\t")) as $r ({};
              if $r[1] == "tree" then .[$r[0]] = {tree: $r[2]}
              else .[$r[0]].toolchains[$r[2] | sub("^[^/]*/"; "")] = $r[3] end)' \
            < "$RUNNER_TEMP/keys.tsv" > "$root/packs.json"
          jq -R -n '[inputs | split("\t") | select(.[1] == "toolchain") | {key: .[2], value: .[3]}] | from_entries' \
            < "$RUNNER_TEMP/keys.tsv" > "$root/toolchains.json"
          jq . "$root/packs.json"
          du -sh "$root"
          find "$root" -type f | wc -l

      # The artifact's root is release/, so the downloaded zip holds
      # yukibana-light/. Level 0: the packs are .wasm with .br and .gz
      # siblings already, and zipping them again buys little.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/light-v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: release

      # A zip, which every system opens; level 0, as the packs are .wasm with
      # .br and .gz siblings already. GitHub takes assets up to 2 GB.
      - name: Archive
        working-directory: release
        run: |
          zip -q -r -0 "../yukibana-light-$GITHUB_REF_NAME.zip" yukibana-light
          cp yukibana-light/packs.json yukibana-light/toolchains.json ../
          ls -l ../yukibana-light-*.zip
          size=$(stat -c %s "../yukibana-light-$GITHUB_REF_NAME.zip")
          [ "$size" -lt 2000000000 ] || { echo "::error::the archive is $size bytes, over GitHub's 2 GB per asset" >&2; exit 1; }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Yukibana Light with every language pack, built from $GITHUB_SHA by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Unzip \`yukibana-light-$GITHUB_REF_NAME.zip\`, then \`python3 serve.py build --port 8080\` in \`yukibana-light/\` and open http://localhost:8080/ (RUN.txt). \`packs.json\` gives what each pack was made from: the key of each toolchain unit it was assembled from (\`toolchains\`), or the git tree id of \`light/packs/<pack>\` it was built from (\`tree\`). \`toolchains.json\` gives the units' keys alone, by \`<pack>/<unit>\`: each is the asset \`toolchain-<pack>-<unit>-<key>.tar.zst\` of the \`light-toolchains\` prerelease.
          EOF
          # A draft first, with every asset, then published: with release
          # immutability on (light/scripts/protect-releases.sh), publishing
          # is what locks the assets and the tag, so it comes last.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Yukibana Light $GITHUB_REF_NAME" --notes-file notes.md \
            "yukibana-light-$GITHUB_REF_NAME.zip" packs.json toolchains.json
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # A light-v* tag or a deploy from main goes live at
  # https://light.yukibana.dev (light/deploy): the archive's build/ is the
  # Worker's assets, and the pack files too big for an asset go to its R2
  # bucket first. The token is the "light" environment's secret, so only
  # this job sees it; without one, the job says so and stops. The group spans
  # every ref, so a tag's deploy and a branch's never run at once; a running
  # deploy is never cancelled, as one stopped between the bucket and
  # `wrangler deploy` would leave blobs nothing names yet, harmless but
  # wasted, and one waiting is replaced by a newer one.
  deploy:
    name: Deploy to light.yukibana.dev
    if: >-
      ${{ (github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/light-v') || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: light
      url: https://light.yukibana.dev
    concurrency:
      group: light-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: light
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/release

      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the light environment: not deployed"
            exit 0
          fi
          mv "$RUNNER_TEMP/release/yukibana-light/build" app/build
          ./deploy/deploy.sh
