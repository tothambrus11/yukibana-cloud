# Builds Yukibana Light (light) with every language pack and makes the
# archive yukibana-light/{build/, serve.py, README.md, RUN.txt}: the app,
# built, with every pack in it, and a server that sends the headers it
# wants.
#
# Pushing a light-v* tag publishes it as the GitHub release of that tag,
# with packs.json, which says from which sources (the git tree id of each
# light/packs/<pack>) every pack in it was built. Run by hand (Actions, "Run
# workflow"), it only uploads the archive as the run's artifact
# yukibana-light-preview-<run number>.
#
# The packs come from light-packs.yml: each pack is downloaded from the pack
# store when its sources have been built before (on the push that changed
# them, usually), and built and tested only otherwise, so a release whose
# packs are all built takes minutes. The assemble job puts the packs in
# app/static/packs, builds the app, type-checks it, smoke-tests the built app
# in Chromium and makes the archive.
name: Yukibana Light release

on:
  workflow_dispatch:
  push:
    tags:
      - light-v*

# A second run of the same ref waits for the first rather than cancelling
# it: a run that finishes leaves its packs for the next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  packs:
    name: Packs
    uses: ./.github/workflows/light-packs.yml
    with:
      upload: true
    permissions:
      contents: write # the pack store
      actions: write # the Haskell pack's inputs; pruning the build caches

  assemble:
    name: Assemble the archive
    needs: packs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: light/app
    steps:
      - uses: actions/checkout@v7

      # 24: setup-node's npm cache runs npm at the repository root, whose
      # package.json (the IDE's) requires Node 24 (devEngines).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: light/app/package-lock.json

      - name: Install the app's dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v7
        with:
          pattern: pack-*
          merge-multiple: true
          path: light/app/static/packs

      - name: Packs
        run: |
          for p in cpp haskell java javascript kotlin php python rust scala swift; do
            [ -f "static/packs/$p/server.js" ] || { echo "pack $p is missing server.js" >&2; exit 1; }
            echo "$p: $(du -sh "static/packs/$p" | cut -f1)"
          done

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Smoke test (JavaScript, in the built app)
        run: node tests/e2e.mjs javascript

      - name: Lay out the archive
        run: |
          root="$RUNNER_TEMP/release/yukibana-light"
          mkdir -p "$root"
          mv build "$root/build"
          cp ../serve.py ../README.md "$root/"
          printf 'python3 serve.py build --port 8080\nthen open http://localhost:8080/\n' > "$root/RUN.txt"
          for p in ../packs/*/; do
            p=$(basename "$p")
            printf '%s\t%s\n' "$p" "$(git rev-parse "HEAD:light/packs/$p")"
          done | jq -R -n '[inputs | split("\t") | {key: .[0], value: .[1]}] | from_entries' > "$RUNNER_TEMP/packs.json"
          cp "$RUNNER_TEMP/packs.json" "$root/packs.json"
          du -sh "$root"
          find "$root" -type f | wc -l

      # The artifact's root is release/, so the downloaded zip holds
      # yukibana-light/. Level 0: the packs are .wasm with .br and .gz
      # siblings already, and zipping them again buys little.
      - uses: actions/upload-artifact@v6
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/light-v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: release

      # A zip, which every system opens; level 0, as the packs are .wasm with
      # .br and .gz siblings already. GitHub takes assets up to 2 GB.
      - name: Archive
        working-directory: release
        run: |
          zip -q -r -0 "../yukibana-light-$GITHUB_REF_NAME.zip" yukibana-light
          cp yukibana-light/packs.json ../packs.json
          ls -l ../yukibana-light-*.zip
          size=$(stat -c %s "../yukibana-light-$GITHUB_REF_NAME.zip")
          [ "$size" -lt 2000000000 ] || { echo "::error::the archive is $size bytes, over GitHub's 2 GB per asset" >&2; exit 1; }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Yukibana Light with every language pack, built from $GITHUB_SHA by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).

          Unzip \`yukibana-light-$GITHUB_REF_NAME.zip\`, then \`python3 serve.py build --port 8080\` in \`yukibana-light/\` and open http://localhost:8080/ (RUN.txt). \`packs.json\` gives the git tree id of \`light/packs/<pack>\` each pack was built from.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Yukibana Light $GITHUB_REF_NAME" --notes-file notes.md \
            "yukibana-light-$GITHUB_REF_NAME.zip" packs.json

  # The release goes live at https://light.yukibana.dev (light/deploy): the
  # archive's build/ is the Worker's assets, and the pack files too big for
  # an asset go to its R2 bucket first. The token is the "light" environment's
  # secret, so only this job sees it; without one, the job says so and stops.
  deploy:
    name: Deploy to light.yukibana.dev
    if: startsWith(github.ref, 'refs/tags/light-v')
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: light
      url: https://light.yukibana.dev
    concurrency:
      group: light-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: light
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v7
        with:
          name: yukibana-light-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/release

      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the light environment: not deployed"
            exit 0
          fi
          mv "$RUNNER_TEMP/release/yukibana-light/build" app/build
          ./deploy/deploy.sh
