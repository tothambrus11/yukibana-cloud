# Nightly: is production exactly what the migrations say? `db diff --linked`
# compares the linked database with the migrations applied to a fresh one and
# prints the difference. Anything printed means something was changed through
# the dashboard or a shell, and this job fails until it is either reverted
# or written down as a migration. The diff engine is a detector here, never
# a generator: see CLAUDE.md.
name: Drift

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Secrets go to the steps that use them and no others. The job reads
# production with the database password, so nothing else it runs (an npm
# install above all) may see it. The account access token is not given at
# all: both commands below take the database URL and nothing more.
jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No install scripts: the Supabase CLI ships its binary as an optional
      # dependency and needs none. A compromised dependency then gets no
      # chance to run while installing; the only code that runs with the
      # password is the Supabase CLI, in the two steps that need it.
      - run: npm ci --ignore-scripts
      - name: Unapplied migrations
        env:
          # The session pooler string: a direct connection is IPv6 and the
          # runner is not. See .github/workflows/database.yml.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npx supabase migration list --db-url "$SUPABASE_DB_URL"
      - name: Diff production against the migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npx supabase db diff --db-url "$SUPABASE_DB_URL" --schema public,app | tee drift.sql
          if [ -s drift.sql ]; then
            echo "::error::production differs from the migrations (see drift.sql above); write the change down as a migration or revert it"
            exit 1
          fi
      # The diff above leaves out the `realtime` schema, which is Supabase's
      # and changes daily; the one rule of ours in it is checked exactly.
      - name: Realtime policies are exactly ours
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f ops/realtime-policies.sql
