# Every check, on every push and pull request.
#
# `app`, `cli` and `demo` are the fast half, one job per project: lint,
# typecheck, unit tests and a build, no services. `stack` proves the
# database and the app agree: the real Supabase image and a real S3 server
# on the runner, every migration applied from empty, the pgTAP suite, and
# the integration suite driving the server modules through the app's own
# connection role. A migration that lints badly, a policy that widens, a
# starter that ships a hidden test: each is a red check here rather than a
# surprise in production.
name: CI

# Pushes to main (which the Database workflow deploys after) and pull
# requests: a branch with a pull request would otherwise run everything
# twice, and a tag push runs nothing it needs. A newer push to a pull request
# cancels the older run; on main every run finishes, because Database
# deploys only after one that succeeded.
on:
  push:
    branches: [main]
    paths-ignore:
      # Yukibana Light has its own workflows (light-*.yml).
      - light/**
      - .github/workflows/light-*.yml
      - .github/actions/light-*/**
  pull_request:
    paths-ignore:
      # Yukibana Light has its own workflows (light-*.yml).
      - light/**
      - .github/workflows/light-*.yml
      - .github/actions/light-*/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# What each job reads: every directory and file its checks, builds and stack
# are made from, and this file. A job that passed on exactly these inputs
# does not run again until one of them changes (a run by hand runs every
# job); see .github/actions/once. A check that
# starts reading something new adds it here, and a project that starts
# depending on another lists the other one too (demo/electron uses the CLI).
env:
  # Every job. The projects install from their own lockfiles; only the
  # stack installs the root's tools (Supabase, squawk, wrangler).
  COMMON_INPUTS: |
    .github/workflows/ci.yml
  APP_INPUTS: |
    app
    wrangler.jsonc
  CLI_INPUTS: |
    cli
    action
    docs/yukibana.schema.json
  DEMO_INPUTS: |
    demo
    cli
  # The stack runs the app's server modules against the database, the
  # bucket and the scripts, so it reads nearly everything but the docs.
  STACK_INPUTS: |
    package.json
    package-lock.json
    .npmrc
    app
    cli
    ops
    scripts
    supabase
    dev
    .squawk.toml
    .env.example
    .dev.vars.example
    wrangler.jsonc

jobs:
  # Which jobs already passed on exactly these inputs.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app-done: ${{ steps.app.outputs.done }}
      app-key: ${{ steps.app.outputs.key }}
      cli-done: ${{ steps.cli.outputs.done }}
      cli-key: ${{ steps.cli.outputs.key }}
      demo-done: ${{ steps.demo.outputs.done }}
      demo-key: ${{ steps.demo.outputs.key }}
      stack-done: ${{ steps.stack.outputs.done }}
      stack-key: ${{ steps.stack.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: app
        uses: ./.github/actions/once
        with:
          name: ci-app
          paths: ${{ env.COMMON_INPUTS }}${{ env.APP_INPUTS }}
      - id: cli
        uses: ./.github/actions/once
        with:
          name: ci-cli
          paths: ${{ env.COMMON_INPUTS }}${{ env.CLI_INPUTS }}
      - id: demo
        uses: ./.github/actions/once
        with:
          name: ci-demo
          paths: ${{ env.COMMON_INPUTS }}${{ env.DEMO_INPUTS }}
      - id: stack
        uses: ./.github/actions/once
        with:
          name: ci-stack
          paths: ${{ env.COMMON_INPUTS }}${{ env.STACK_INPUTS }}

  # Whether `npm run format` would change anything. It is quick enough to run
  # every time, so it is not in the plan. Only oxfmt is needed from the root's
  # tools, and none of their install scripts.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run format:check

  # The registry: lint, typecheck, unit tests and a production build, no
  # services.
  app:
    needs: plan
    if: needs.plan.outputs.app-done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.app-key }}

  # The CLI, and the course fixture checked with the CLI it builds.
  cli:
    needs: plan
    if: needs.plan.outputs.cli-done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the fixture with the built CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          tar -xzf tests/fixtures/repo.tar.gz -C "$RUNNER_TEMP/fixture" --strip-components=1
          node dist/index.js check "$RUNNER_TEMP/fixture" --folder calc
      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.cli-key }}

  # The desktop demo, against the CLI library it imports (file:../../cli),
  # built first as `npm run check` builds it.
  demo:
    needs: plan
    if: needs.plan.outputs.demo-done != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cli/package-lock.json
            demo/electron/package-lock.json
      - run: npm ci --no-audit --no-fund --prefix cli && npm run build --prefix cli
      - run: npm ci --no-audit --no-fund --prefix demo/electron
      - run: npm run lint --prefix demo/electron
      - run: npm run typecheck --prefix demo/electron
      - run: npm test --prefix demo/electron
      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.demo-key }}

  stack:
    needs: plan
    if: needs.plan.outputs.stack-done != 'true'
    # Must be a VM runner: a `container:` job breaks Supabase's bind mounts.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Auth needs a GitHub provider configured to start; nothing logs in here.
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ci-placeholder
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ci-placeholder
    steps:
      # The stack publishes fixed host ports, 54320-54329 (supabase/config.toml),
      # which lie in Linux's ephemeral range: any outgoing connection, such as an
      # image pull, could take one first and fail the start. Reserving them takes
      # them out of that range; explicit binds like Docker's still get them.
      - name: Keep the stack's ports out of the ephemeral range
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            cli/package-lock.json
            demo/electron/package-lock.json
      - run: npm run install:all

      - name: Preflight
        run: ./scripts/preflight.sh

      # Lock-taking or otherwise dangerous DDL, before anything runs it.
      - name: Lint migrations
        run: npm run db:lint

      - name: Start Supabase
        run: npx supabase start
      # The login tests talk to Auth as the page does, with the publishable
      # key; this is the stack's own rather than the default env.ts assumes.
      - name: Publishable key for the integration tests
        run: echo "SUPABASE_PUBLISHABLE_KEY=$(npx supabase status -o json | jq -r .PUBLISHABLE_KEY)" >> "$GITHUB_ENV"
      - name: Start the bucket
        run: npm run storage:start

      - name: Smoke test
        run: npm run smoke

      # Every migration from empty, then the seeds: what a fresh environment is.
      - name: Rebuild the database from migrations
        run: npm run db:reset

      - name: Database tests (pgTAP)
        run: npm run db:test

      # The same check the nightly drift job runs against production: kept
      # here so its expected policy changes in the same pull request as the
      # migration that changes the policy.
      - name: Realtime policies are exactly ours
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f ops/realtime-policies.sql

      # And the event triggers, which are in no schema: what drift checks in
      # production is what the migrations build here.
      - name: Event triggers are exactly ours
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -q -f ops/event-triggers.sql

      # After the reset, which empties Auth's tables along with ours: the
      # registry's OAuth client, as an environment has it, for the connect
      # tests (the IDE and CLI login by way of the website).
      - name: Register the OAuth client
        run: |
          id=$(node scripts/oauth-client.mjs)
          echo "SUPABASE_OAUTH_CLIENT_ID=$id" >> "$GITHUB_ENV"

      - name: Integration tests
        run: npm run test:integration

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.stack-key }}

      - name: Stop
        if: always()
        run: |
          npx supabase stop || true
          npm run storage:stop || true
