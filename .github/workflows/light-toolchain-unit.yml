# Builds one toolchain unit of a split Yukibana Light pack (light/packs/<pack>/
# toolchains/<unit>/, named <pack>/<unit>), attests the archive it made, and
# hands it to the rest of the same run as the artifact
# toolchain-<pack>-<unit>-<key>, which a dependent unit's job and the pack's
# assemble job take with `pack-toolchain.sh ensure --from`, and which, on
# main, light-packs.yml's store-units job puts in the toolchain store
# (light-toolchains) byte for byte.
#
# Called only by light-packs.yml's wave jobs, one call per unit its plan job
# found missing from the store, and never by a release run of it (those jobs
# carry `!inputs.upload`; light/scripts/test-workflows.mjs checks it). No job
# builds more than one unit: the units it needs come from earlier waves'
# artifacts, or from the store, and are never built here (--no-build-deps),
# so no job approaches the six-hour limit because of another unit.
#
# Provenance. This workflow is the one that signs toolchains: the archive is
# attested (actions/attest-build-provenance) with this run's OIDC token, so
# the attestation names this workflow and the ref the run was on, which no
# pull request can forge. Every consumer of the store checks that it says
# refs/heads/main (pack-store.sh, Provenance); a pull request's own later
# runs check that it says that pull request's ref. Nothing here can write to
# a release: this workflow has `contents: read`, and the store is written
# only by light-packs.yml's main-only store-units job.
#
# A pull request rebuilds nothing it already built: before building, a run
# of a same-repository pull request looks for an artifact of the same name
# (the unit and its key) from its own earlier runs, and takes it when its
# attestation names this pull request's ref (pack-store.sh
# toolchain-artifact). Artifacts are kept 14 days. Promotion of a pull
# request's build to main does not exist (experiment E3 decides whether it
# should): main builds every unit itself, warm from its own cache.
#
# Each unit has its own Actions cache of its download and compile cache
# ($PACK_CACHE), under the prefix light/<pack>/<unit>/ ending in the
# separator, so one unit's prefix is never the start of another's
# (haskell/ghc and haskell/ghc-wasm) nor of an unsplit pack's light-<pack>-
# caches. The cache is saved even when the build fails, so a rerun resumes
# where it stopped. Older caches are pruned on main's ref by light-packs.yml
# and on pull requests' by light-caches.yml, never here: deleting needs
# `actions: write`, which no pull request job has.
#
# Third-party actions are pinned by commit (test-workflows.mjs).
name: Yukibana Light toolchain unit

on:
  workflow_call:
    inputs:
      unit:
        description: The unit to build, <pack>/<unit>
        type: string
        required: true
      key:
        description: The unit's key as the plan job computed it; this job fails by name when its own differs
        type: string
        required: true
      deps:
        description: A download-artifact pattern naming the artifacts of the units it needs that this run built (empty when none was)
        type: string
        default: ''

# What the caller grants (light-packs.yml's wave jobs), no more. id-token
# and attestations sign this run's own archive for this run's own ref; they
# cannot write a store or sign for another ref.
permissions:
  contents: read
  actions: read # a pull request's earlier builds (toolchain-artifact)
  attestations: write
  id-token: write

env:
  PACK_CACHE: /home/runner/.cache/yukibana-packs
  TOOLCHAIN_CACHE: /home/runner/.cache/yukibana-toolchains
  JOBS: 4
  GH_TOKEN: ${{ github.token }}
  UNIT: ${{ inputs.unit }}
  FROM: ${{ github.workspace }}/../from
  TIMINGS: ${{ github.workspace }}/../timings
  # Every toolchain fetched from the store is verified (pack-store.sh).
  LIGHT_TOOLCHAIN_PROVENANCE: required

jobs:
  unit:
    name: Unit ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    # The runner's limit. The slowest unit, cpp/compilers, builds cold in
    # 185 minutes (light/packs/cpp/README.md has every cpp unit's time); a
    # unit that comes within an hour of this is a unit to split, not a job
    # to lengthen.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # The key is computed again here, on the same commit: a difference
      # means something outside the files reached the key (a knob set in
      # one job only), which would store a toolchain under a key no plan
      # asked for.
      - name: The unit and its key
        env:
          PLANNED: ${{ inputs.key }}
        run: |
          key="$(light/scripts/pack-store.sh toolchain-key "$UNIT")"
          if [ "$key" != "$PLANNED" ]; then
            echo "::error title=$UNIT::the plan job keyed $UNIT as $PLANNED and this job as $key on the same commit; something besides its files reached the key" >&2
            exit 1
          fi
          pack="${UNIT%%/*}"
          {
            echo "PACK=$pack"
            echo "UNIT_NAME=${UNIT#*/}"
            echo "UNIT_DIR=light/packs/$pack/toolchains/${UNIT#*/}"
          } >> "$GITHUB_ENV"

      # A same-repository pull request's own earlier build of this unit and
      # key, if one of its runs left it and attested it for this pull
      # request's ref; everything up to the attestation is then skipped. A
      # fork's runs cannot attest, so they never look.
      - name: This pull request's earlier build
        id: earlier
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          status=0
          path="$(light/scripts/pack-store.sh toolchain-artifact "$UNIT" "$RUNNER_TEMP/earlier" \
            --ref "$GITHUB_REF" --branch "$HEAD_BRANCH")" || status=$?
          case "$status" in
            0) echo "path=$path" >> "$GITHUB_OUTPUT"
               echo "$UNIT: reused this pull request's earlier build" >> "$GITHUB_STEP_SUMMARY" ;;
            3) ;;
            *) exit "$status" ;;
          esac

      # Unconditional when building: a unit cannot know before it builds how
      # much it writes, and the stub's minute here is cheaper than a
      # compiler that runs out of disk two hours in.
      - name: Free disk space
        if: steps.earlier.outputs.path == ''
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      # The unit's own deps.apt only: it is in the unit's directory, so an
      # input of its key. A pack-level deps.apt would reach every unit's
      # build and be in no unit's key, so a split pack has none
      # (light/packs/contract.test.mjs).
      - name: Install build dependencies
        if: steps.earlier.outputs.path == '' && hashFiles(format('{0}/deps.apt', env.UNIT_DIR)) != ''
        run: |
          sudo apt-get update -q
          grep -v '^#' "$UNIT_DIR/deps.apt" | xargs sudo apt-get install -y -q --no-install-recommends

      # What earlier waves of this run built of the units it needs. A unit
      # the store already had is not among them: ensure fetches it, and
      # verifies that main built it.
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: steps.earlier.outputs.path == '' && inputs.deps != ''
        with:
          pattern: ${{ inputs.deps }}
          merge-multiple: true
          path: ${{ env.FROM }}

      - name: Restore the unit's build cache
        id: cache
        if: steps.earlier.outputs.path == ''
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.PACK_CACHE }}
            !${{ env.PACK_CACHE }}/swift/toolchain
          key: light/${{ inputs.unit }}/${{ inputs.key }}/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            light/${{ inputs.unit }}/${{ inputs.key }}/
            light/${{ inputs.unit }}/

      # Hermetic (pack-toolchain.sh): the unit's inputs, and the units it
      # needs read-only at $DEP_<UNIT>, taken from this run's artifacts or
      # the store and never built here. --no-fetch: the unit itself is
      # built, as the plan found it missing. Were it fetched because another
      # run stored the same key meanwhile, its toolchain.json would name
      # that run's commit, and archive and store-units would refuse it.
      - name: Build the unit
        id: build
        if: steps.earlier.outputs.path == ''
        env:
          RESTORED: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          how="cold"
          [ -z "$RESTORED" ] || how="warm, from $RESTORED"
          trap 'echo "Build $UNIT ($how)|$SECONDS" >> "$TIMINGS"' EXIT
          mkdir -p "$FROM"
          dir="$(light/scripts/pack-toolchain.sh ensure "$UNIT" --from "$FROM" --no-build-deps --no-fetch)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Only a toolchain built clean at HEAD is archived (toolchain-archive
      # refuses any other). Level 0 in the artifact: it is zstd already.
      - name: Archive the unit
        id: archive
        if: steps.build.outcome == 'success'
        env:
          DIR: ${{ steps.build.outputs.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          echo "path=$(light/scripts/pack-store.sh toolchain-archive "$UNIT" "$DIR" "$RUNNER_TEMP/archive")" >> "$GITHUB_OUTPUT"

      # The archive's provenance: this workflow, this run's ref, this commit.
      # A fork's run has no id-token to sign with; its artifact serves this
      # run only.
      - name: Attest the unit
        if: >-
          steps.archive.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: steps.archive.outcome == 'success' || steps.earlier.outputs.path != ''
        with:
          name: toolchain-${{ env.PACK }}-${{ env.UNIT_NAME }}-${{ inputs.key }}
          path: ${{ steps.earlier.outputs.path || steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Disk and cache usage
        if: always()
        run: |
          df -h /
          du -sh "$PACK_CACHE"/* 2>/dev/null || true

      # Saved also when the build failed or was cancelled. $TOOLCHAIN_CACHE
      # is not in it: the store and this run's artifacts are its copies.
      - name: Save the unit's build cache
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.PACK_CACHE }}
            !${{ env.PACK_CACHE }}/swift/toolchain
          key: light/${{ inputs.unit }}/${{ inputs.key }}/${{ github.run_id }}-${{ github.run_attempt }}

      - name: Timings
        if: always()
        run: |
          [ -s "$TIMINGS" ] || exit 0
          {
            echo "| $UNIT | seconds |"
            echo "|---|---:|"
            sed 's/^\(.*\)|\([0-9]*\)$/| \1 | \2 |/' "$TIMINGS"
          } >> "$GITHUB_STEP_SUMMARY"
