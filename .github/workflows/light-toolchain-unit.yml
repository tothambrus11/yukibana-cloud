# Builds one toolchain unit of a split Yukibana Light pack (light/packs/<pack>/
# toolchains/<unit>/, named <pack>/<unit>) and hands it on: to the toolchain
# store (light-toolchains), and to the rest of the same run as the artifact
# toolchain-<pack>-<unit>-<key>, which a dependent unit's job and the pack's
# assemble job take with `pack-toolchain.sh ensure --from`.
#
# Called only by light-packs.yml's wave jobs, one call per unit its plan job
# found missing from the store, and never by a release run of it (those jobs
# carry `!inputs.upload`; light/scripts/test-workflows.mjs checks it). No job
# builds more than one unit: the units it needs come from earlier waves'
# artifacts, or from the store, and are never built here (--no-build-deps),
# so no job approaches the six-hour limit because of another unit.
#
# Each unit has its own Actions cache of its download and compile cache
# ($PACK_CACHE), under the prefix light/<pack>/<unit>/ ending in the
# separator, so one unit's prefix is never the start of another's
# (haskell/ghc and haskell/ghc-wasm) nor of an unsplit pack's light-<pack>-
# caches. The cache is saved even when the build fails, so a rerun resumes
# where it stopped, and the older caches of the unit are then deleted.
name: Yukibana Light toolchain unit

on:
  workflow_call:
    inputs:
      unit:
        description: The unit to build, <pack>/<unit>
        type: string
        required: true
      key:
        description: The unit's key as the plan job computed it; this job fails by name when its own differs
        type: string
        required: true
      deps:
        description: A download-artifact pattern naming the artifacts of the units it needs that this run built (empty when none was)
        type: string
        default: ''

# What the caller grants (light-packs.yml), no more: the store's release, and
# deleting this unit's older caches.
permissions:
  contents: write
  actions: write

env:
  PACK_CACHE: /home/runner/.cache/yukibana-packs
  TOOLCHAIN_CACHE: /home/runner/.cache/yukibana-toolchains
  JOBS: 4
  GH_TOKEN: ${{ github.token }}
  UNIT: ${{ inputs.unit }}
  FROM: ${{ github.workspace }}/../from
  TIMINGS: ${{ github.workspace }}/../timings

jobs:
  unit:
    name: Unit ${{ inputs.unit }}
    runs-on: ubuntu-24.04
    # The runner's limit: no unit is measured yet (T4 takes cpp's cold
    # times from its own pull-request run), and a unit that needs more is a
    # unit to split, not a job to lengthen.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The key is computed again here, on the same commit: a difference
      # means something outside the files reached the key (a knob set in
      # one job only), which would store a toolchain under a key no plan
      # asked for.
      - name: The unit and its key
        env:
          PLANNED: ${{ inputs.key }}
        run: |
          key="$(light/scripts/pack-store.sh toolchain-key "$UNIT")"
          if [ "$key" != "$PLANNED" ]; then
            echo "::error title=$UNIT::the plan job keyed $UNIT as $PLANNED and this job as $key on the same commit; something besides its files reached the key" >&2
            exit 1
          fi
          pack="${UNIT%%/*}"
          {
            echo "PACK=$pack"
            echo "UNIT_NAME=${UNIT#*/}"
            echo "UNIT_DIR=light/packs/$pack/toolchains/${UNIT#*/}"
          } >> "$GITHUB_ENV"

      # Unconditional: a unit cannot know before it builds how much it
      # writes, and the stub's minute here is cheaper than a compiler that
      # runs out of disk two hours in.
      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      # The unit's own deps.apt only: it is in the unit's directory, so an
      # input of its key. A pack-level deps.apt would reach every unit's
      # build and be in no unit's key, so a split pack has none
      # (light/packs/contract.test.mjs).
      - name: Install build dependencies
        if: hashFiles(format('{0}/deps.apt', env.UNIT_DIR)) != ''
        run: |
          sudo apt-get update -q
          grep -v '^#' "$UNIT_DIR/deps.apt" | xargs sudo apt-get install -y -q --no-install-recommends

      # What earlier waves of this run built of the units it needs. A unit
      # the store already had is not among them: ensure fetches it.
      - uses: actions/download-artifact@v7
        if: inputs.deps != ''
        with:
          pattern: ${{ inputs.deps }}
          merge-multiple: true
          path: ${{ env.FROM }}

      - name: Restore the unit's build cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.PACK_CACHE }}
            !${{ env.PACK_CACHE }}/swift/toolchain
          key: light/${{ inputs.unit }}/${{ inputs.key }}/${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            light/${{ inputs.unit }}/${{ inputs.key }}/
            light/${{ inputs.unit }}/

      # Hermetic (pack-toolchain.sh): the unit's inputs, and the units it
      # needs read-only at $DEP_<UNIT>, taken from this run's artifacts or
      # the store and never built here. --no-fetch: the unit itself is
      # built, as the plan found it missing. Were it fetched because another
      # run stored the same key meanwhile, its toolchain.json would name
      # that run's commit, and publish and archive below would refuse it.
      - name: Build the unit
        id: build
        env:
          RESTORED: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          how="cold"
          [ -z "$RESTORED" ] || how="warm, from $RESTORED"
          trap 'echo "Build $UNIT ($how)|$SECONDS" >> "$TIMINGS"' EXIT
          mkdir -p "$FROM"
          dir="$(light/scripts/pack-toolchain.sh ensure "$UNIT" --from "$FROM" --no-build-deps --no-fetch)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # Only a toolchain built from clean HEAD goes in the store (publish
      # refuses any other); a pull request from a fork has no right to write
      # it.
      - name: Put the unit in the store
        if: >-
          steps.build.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          DIR: ${{ steps.build.outputs.dir }}
        run: light/scripts/pack-store.sh toolchain-publish "$UNIT" "$DIR"

      # The same archive, for this run's later waves and the pack's assemble
      # job, also when the store could not take it (a fork). Level 0: it is
      # zstd already.
      - name: Archive the unit for this run
        id: archive
        if: steps.build.outcome == 'success'
        env:
          DIR: ${{ steps.build.outputs.dir }}
        run: |
          mkdir -p "$RUNNER_TEMP/archive"
          echo "path=$(light/scripts/pack-store.sh toolchain-archive "$UNIT" "$DIR" "$RUNNER_TEMP/archive")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        if: steps.archive.outcome == 'success'
        with:
          name: toolchain-${{ env.PACK }}-${{ env.UNIT_NAME }}-${{ inputs.key }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Disk and cache usage
        if: always()
        run: |
          df -h /
          du -sh "$PACK_CACHE"/* 2>/dev/null || true

      # Saved also when the build failed or was cancelled. $TOOLCHAIN_CACHE
      # is not in it: the store and this run's artifacts are its copies.
      - name: Save the unit's build cache
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.PACK_CACHE }}
            !${{ env.PACK_CACHE }}/swift/toolchain
          key: light/${{ inputs.unit }}/${{ inputs.key }}/${{ github.run_id }}-${{ github.run_attempt }}

      # The cache just saved holds everything the unit's older ones do (it
      # was restored from the newest), so they go. The prefix ends in its
      # separator, so no other unit's caches match it. Scoping this to the
      # run's own ref is ST1a's.
      - name: Delete the unit's older build caches
        if: always() && steps.cache.outcome == 'success'
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "light/$UNIT/" --sort created_at --order desc \
            --limit 100 --json key --jq '.[1:][].key' |
            while read -r key; do gh cache delete "$key" --repo "$GITHUB_REPOSITORY"; done

      - name: Timings
        if: always()
        run: |
          [ -s "$TIMINGS" ] || exit 0
          {
            echo "| $UNIT | seconds |"
            echo "|---|---:|"
            sed 's/^\(.*\)|\([0-9]*\)$/| \1 | \2 |/' "$TIMINGS"
          } >> "$GITHUB_STEP_SUMMARY"
