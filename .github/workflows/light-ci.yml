# Checks Yukibana Light (light) on every push to a pull
# request and to main, in a few minutes:
#
# - app: type-check (svelte-check, the service worker, the shared modules),
#   the unit tests (the modules' import boundaries among them, and their
#   tarballs installed and loaded as another site would), and
#   the Download test for the languages whose tools the runner image has
#   (Node: JavaScript, TypeScript, web, p5.js in both modes).
# - javascript: the JavaScript/TypeScript pack built from npm (no toolchain
#   to compile, so a cold build is a minute or two), its own tests, then the
#   app built with that pack alone and driven in Chromium for the four
#   languages it serves.
# - pack-units: the packs' own tests that need no built pack (the C++
#   pack's compiler output filters, the Linux pack's initramfs writer,
#   the Haskell language server's outline and hints) and the split packs' contract
#   (light/packs/contract.test.mjs). A change to a pack's glue or scripts
#   is otherwise first tested by a pack build, up to hours later. The pack
#   and toolchain store scripts' tests and the workflows' rules
#   (test-pack-store, test-pack-toolchain, test-workflows) are
#   light-packs.yml's store job's alone, which runs them before anything
#   uses the stores, a release included; they ran here too until both
#   jobs ran the same suites on every change to them.
# - hylo-example: light/examples/hylo, a docs page of Hylo snippets on
#   Hylo's own compiler through one runner pool: type-check, its unit tests,
#   a Vite build and the page driven in Chromium with the real compiler.
# - two-up-example: light/examples/two-up, two instances of the core on
#   one page (C++ in Monaco, Python in a textarea): type-check, a Vite
#   build and its bundle fixtures. Its end-to-end test needs the C++ and
#   Python packs built and is run where they are (node test.mjs).
# - svelte-course-example: light/examples/svelte-course, a Svelte 5 lesson
#   page of graded exercises over one instance and one pool: type-check,
#   its unit tests, a Vite build with its bundle fixtures, and the page in
#   Chromium with the JavaScript pack built here. The other exercises'
#   packs take too long to build for this workflow, so test.mjs skips them
#   and says so; it is run with them where they are installed.
# - react-explorer-example: light/examples/react-explorer, a
#   systems-programming article in React 19 over the core: type-check, its
#   unit tables, a Vite build and its bundle fixtures (the first load's
#   budget, Monaco and every compiler lazy). Its end-to-end test needs the
#   cpp, rust, python, javascript and lldb packs built (swift optional), which
#   this workflow never builds, and is run where they are (node test.mjs).
# - astro-docs-example: light/examples/astro-docs, a static Astro docs site
#   whose code samples are playground islands: type-check (astro check,
#   tsc), `astro build`, and the built site driven in Chromium under
#   `astro preview` (test.mjs) with the packs the pack store has (fetched
#   with --any, so the newest build of each), JavaScript required and
#   built here when the store has none; a playground whose pack could not
#   be fetched is reported as skipped by name.
# - exports: a smoke test of every build system Download offers. The sample
#   project of a language it builds is downloaded with it, and the CI job
#   that builds and tests it (tests/export-ci.mjs) runs in the image the
#   download names, with Docker, as the user's CI would. exports-done
#   records them as passed together.
#
# Each job runs only when what it reads changed since it last passed
# (.github/actions/once): its inputs are listed in the plan job.
#
# The other packs build compilers to Wasm and take from twenty minutes to
# hours cold; light-release.yml builds all of them, by hand or on a light-v*
# tag, and its packs' own tests are run there by their build scripts.
name: Yukibana Light

on:
  push:
    branches:
      - main
    paths:
      - light/**
      - .github/workflows/light-ci.yml
      - .github/workflows/light-packs.yml
      - .github/workflows/light-toolchain-unit.yml
      - .github/actions/once/**
  pull_request:
    paths:
      - light/**
      - .github/workflows/light-ci.yml
      - .github/workflows/light-packs.yml
      - .github/workflows/light-toolchain-unit.yml
      - .github/actions/once/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PACK_CACHE: /home/runner/.cache/yukibana-packs

jobs:
  # Which jobs already passed on exactly these inputs. The app's tests also
  # read the C++ pack's sources (its toolchain flags, target table and test
  # fixtures), which are listed with it, and the app checks, tests and
  # bundles the shared modules (light/modules).
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      app-done: ${{ steps.app.outputs.done }}
      app-key: ${{ steps.app.outputs.key }}
      javascript-done: ${{ steps.javascript.outputs.done }}
      javascript-key: ${{ steps.javascript.outputs.key }}
      pack-units-done: ${{ steps.pack-units.outputs.done }}
      pack-units-key: ${{ steps.pack-units.outputs.key }}
      hylo-example-done: ${{ steps.hylo-example.outputs.done }}
      hylo-example-key: ${{ steps.hylo-example.outputs.key }}
      two-up-example-done: ${{ steps.two-up-example.outputs.done }}
      two-up-example-key: ${{ steps.two-up-example.outputs.key }}
      svelte-course-example-done: ${{ steps.svelte-course-example.outputs.done }}
      svelte-course-example-key: ${{ steps.svelte-course-example.outputs.key }}
      react-explorer-example-done: ${{ steps.react-explorer-example.outputs.done }}
      react-explorer-example-key: ${{ steps.react-explorer-example.outputs.key }}
      astro-docs-example-done: ${{ steps.astro-docs-example.outputs.done }}
      astro-docs-example-key: ${{ steps.astro-docs-example.outputs.key }}
      exports-done: ${{ steps.exports.outputs.done }}
      exports-key: ${{ steps.exports.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: app
        uses: ./.github/actions/once
        with:
          name: light-app
          paths: |
            light/app
            light/modules
            light/packs/cpp/src
            light/packs/cpp/tests/fixtures
            .github/workflows/light-ci.yml
      - id: javascript
        uses: ./.github/actions/once
        with:
          name: light-javascript
          paths: |
            light/app
            light/modules
            light/packs/javascript
            .github/workflows/light-ci.yml
      # Every file the pack-units tests read, and the files that decide
      # how a pack is built (a change there is a change those tests are
      # about, even when they do not open it). The contract test and the C++
      # units' test read the key's definition (light/scripts); the contract
      # test also asks every split pack for its test.sh, and partitions
      # every file of a split pack, which no pathspec short of the pack
      # names: light-packs.yml's assemble job, whose inputs are the whole
      # pack, runs it again on any change to one.
      - id: pack-units
        uses: ./.github/actions/once
        with:
          name: light-pack-units
          paths: |
            light/packs/cpp/src
            light/packs/cpp/tests
            light/packs/cpp/test-emit.mjs
            light/packs/cpp/test-build-lib.mjs
            light/packs/cpp/test-units.mjs
            light/packs/cpp/test-selection.mjs
            light/modules/protocol/runner.ts
            light/packs/cpp/glue.paths
            light/packs/cpp/*.sh
            light/packs/cpp/build-test-libs-linux.mjs
            light/packs/cpp/patches
            light/packs/linux/src
            light/packs/linux/test-cpio.mjs
            light/packs/linux/lib.sh
            light/packs/linux/vm
            light/packs/linux/toolchains
            light/packs/haskell/src
            light/packs/haskell/test-symbols.mjs
            light/packs/haskell/tests
            light/packs/haskell/test-dumps.mjs
            light/packs/swift/src
            light/packs/swift/tests
            light/packs/swift/test-emit.mjs
            light/packs/swift/test-target.mjs
            light/packs/swift/test-xctest.mjs
            light/packs/rust/src
            light/packs/rust/tests
            light/packs/rust/test-mir.mjs
            light/packs/python/runner/bytecode.py
            light/packs/python/test-bytecode.py
            light/packs/java/src/classfile.js
            light/packs/java/tests
            light/packs/java/test-classfile.mjs
            light/packs/*/build.sh
            light/packs/*/glue.sh
            light/packs/*/requires.json
            light/packs/*/pins.sh
            light/packs/*/toolchain.*
            light/packs/*/toolchains
            light/packs/*/glue.paths
            light/packs/*/test.sh
            light/packs/stub
            light/packs/kit
            light/packs/*/shared
            light/packs/contract.test.mjs
            light/scripts
            .github/workflows/light-ci.yml
      # The example runs the shared modules as an outside host would.
      - id: hylo-example
        uses: ./.github/actions/once
        with:
          name: light-hylo-example
          paths: |
            light/examples/hylo
            light/modules
            .github/workflows/light-ci.yml
      - id: two-up-example
        uses: ./.github/actions/once
        with:
          name: light-two-up-example
          paths: |
            light/examples/two-up
            light/modules
            .github/workflows/light-ci.yml
      # Its end-to-end test runs on the JavaScript pack, the one pack built
      # here, so the pack's sources are inputs too.
      - id: svelte-course-example
        uses: ./.github/actions/once
        with:
          name: light-svelte-course-example
          paths: |
            light/examples/svelte-course
            light/modules
            light/packs/javascript
            .github/workflows/light-ci.yml
      - id: react-explorer-example
        uses: ./.github/actions/once
        with:
          name: light-react-explorer-example
          paths: |
            light/examples/react-explorer
            light/modules
            .github/workflows/light-ci.yml
      - id: astro-docs-example
        uses: ./.github/actions/once
        with:
          name: light-astro-docs-example
          paths: |
            light/examples/astro-docs
            light/modules
            light/packs/javascript
            .github/workflows/light-ci.yml
      # What a download is made of: the generators (the languages'
      # packages' export.ts under light/modules, composed by the app's
      # export.ts and export-tooling.ts), the samples, the instance that
      # loads them, and what they read of the C++ pack (lang-cpp's
      # export.ts's pins of its libraries).
      - id: exports
        uses: ./.github/actions/once
        with:
          name: light-exports
          paths: |
            light/app/src/lib/export.ts
            light/app/src/lib/export-tooling.ts
            light/app/src/lib/languages.ts
            light/app/src/lib/packs.ts
            light/app/src/lib/yukibana.ts
            light/modules
            light/app/tests/export-ci.mjs
            light/app/tests/export-loaded.mjs
            .github/workflows/light-ci.yml

  app:
    name: App
    needs: plan
    if: needs.plan.outputs.app-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: light/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: light/app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Download test (Node languages)
        run: node tests/export.mjs javascript typescript web p5 p5-global

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.app-key }}

  javascript:
    name: JavaScript pack and e2e
    needs: plan
    if: needs.plan.outputs.javascript-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: light
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 22: the runner's test report is Node 22's, and test-run.mjs
      # compares it line for line with this machine's `node --test` (Node 24
      # reports a failing todo differently). No npm cache from setup-node:
      # it asks npm at the repository root, whose package.json (the IDE)
      # refuses Node 22; the pack caches its own npm downloads below.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The app's playwright-core installs the Chromium that the pack's tests
      # and the e2e both launch (as $CHROMIUM).
      - name: Install the app and Chromium
        working-directory: light/app
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      # The pack's npm cache: its build.sh installs from it.
      - uses: actions/cache@v6
        with:
          path: ${{ env.PACK_CACHE }}/javascript
          key: ci-javascript-${{ hashFiles('light/packs/javascript/package-lock.json') }}
          restore-keys: ci-javascript-

      - name: Build the pack
        working-directory: light/packs/javascript
        run: ./build.sh

      - name: Type-check the pack
        working-directory: light/packs/javascript
        run: npm run typecheck

      - name: Pack tests
        working-directory: light/packs/javascript
        run: npm test

      - name: Build the app
        working-directory: light/app
        run: npm run build

      # The unit job has no build, so this one test is skipped there; here it
      # runs on the build just made, and a missing build fails it.
      - name: What the built app carries
        working-directory: light/app
        env:
          BUNDLE_REQUIRED: '1'
        run: node --test tests/unit/bundle.test.mjs

      - name: End-to-end (JavaScript, TypeScript, web, p5.js in both modes)
        working-directory: light/app
        run: node tests/e2e.mjs javascript typescript web p5 p5-global

      # Needs no pack; here because this job has a build and a Chromium.
      - name: End-to-end (projects in links, Share)
        working-directory: light/app
        run: node tests/e2e-links.mjs

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.javascript-key }}

  pack-units:
    name: Pack unit tests
    needs: plan
    if: needs.plan.outputs.pack-units-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 22, the version these tests are run with locally. They import
      # only the packs' own sources and node's built-ins: no npm install.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pure functions over fixtures written out in the repository; the
      # cpio test compares with GNU cpio, which the runner image has. The
      # build-lib test decides, with fakes, when the build reuses a cached
      # tree or step (git, tar, xz and patch, which the image has too).
      # test-build-lib.mjs and test-units.mjs cover the Linux pack's vm unit
      # too, which builds with this pack's emsdk and musl units.
      - name: C++ pack (compiler output views, reuse of build trees, its units' keys and the Linux VM's, one test's selection)
        working-directory: light/packs/cpp
        run: node --test test-emit.mjs test-build-lib.mjs test-units.mjs test-selection.mjs

      - name: Linux pack (initramfs archives)
        working-directory: light/packs/linux
        run: node --test test-cpio.mjs

      - name: Haskell pack (outline, symbol search, inlay hints, compiler output views)
        working-directory: light/packs/haskell
        run: node --test test-symbols.mjs test-dumps.mjs

      - name: Swift pack (compiler output views, swift.env, the Linux argument vectors and a test run's runs)
        working-directory: light/packs/swift
        run: node --test test-emit.mjs test-target.mjs test-xctest.mjs

      - name: Rust pack (the compiler output views and the demangler)
        working-directory: light/packs/rust
        run: node --test test-mir.mjs

      # The runner image's CPython (3.12); the browser's is 3.14, and the
      # tests check only what every version shows.
      - name: Python pack (the bytecode view)
        working-directory: light/packs/python
        run: python3 -I test-bytecode.py

      - name: Java pack (the bytecode view)
        working-directory: light/packs/java
        run: node --test test-classfile.mjs

      - name: The split packs' contract
        working-directory: light
        run: node --test packs/contract.test.mjs

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.pack-units-key }}

  hylo-example:
    name: Hylo example
    needs: plan
    if: needs.plan.outputs.hylo-example-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: light/examples/hylo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: light/examples/hylo/package-lock.json

      # Its own playwright-core installs the Chromium the end-to-end test launches.
      - name: Install the example and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Type-check
        run: npm run check

      - name: Unit tests (the runner and the page, workers stood in for)
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end (Chromium, the real Hylo compiler)
        run: npm run test:e2e

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.hylo-example-key }}

  two-up-example:
    name: Two-up example
    needs: plan
    if: needs.plan.outputs.two-up-example-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: light/examples/two-up
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: light/examples/two-up/package-lock.json

      - name: Install the example
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Bundle fixtures (the initial scripts' budget, one copy of every module)
        run: npm test
        env:
          BUNDLE_REQUIRED: '1'

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.two-up-example-key }}

  react-explorer-example:
    name: React explorer example
    needs: plan
    if: needs.plan.outputs.react-explorer-example-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: light/examples/react-explorer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: light/examples/react-explorer/package-lock.json

      - name: Install the example
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # The unit tables (ANSI colours, source-line mapping) and the bundle
      # fixtures; BUNDLE_REQUIRED fails a missing build instead of skipping.
      - name: Unit tables and bundle fixtures
        run: npm test
        env:
          BUNDLE_REQUIRED: '1'

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.react-explorer-example-key }}

  # One job per build system, each with a language whose sample it builds
  # (tests/unit/export-options.test.mjs checks that every build system is
  # here). Every job the download's CI has: build and test, and the format
  # and lint checks, whose tools the build files now pin (Spotless in pom.xml
  # and build.gradle.kts, Prettier in package.json, and so on).
  astro-docs-example:
    name: Astro docs example
    needs: plan
    if: needs.plan.outputs.astro-docs-example-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: light/examples/astro-docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 24 as two-up; packs.ts runs under node's type stripping (22.18 and later).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: light/examples/astro-docs/package-lock.json

      # Its own playwright-core installs the Chromium the end-to-end test launches.
      - name: Install the example and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      # The newest stored build of each pack the site uses (pack-store.sh
      # reads without an account; the token only lifts the rate limit). A
      # pack the store has none of is said as a warning and its playgrounds
      # are skipped by name; JavaScript, which every page but the cookbook
      # needs, is built here instead (a minute or two from npm).
      - name: The packs
        working-directory: light
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pack in javascript python cpp rust swift; do
            scripts/pack-store.sh fetch "$pack" --any || echo "::warning title=$pack::the pack store has no build of $pack; the astro-docs playgrounds in $pack are skipped"
          done
          [ -f app/static/packs/javascript/runner.js ] || (cd packs/javascript && ./build.sh)

      - name: End-to-end (Chromium, astro preview, the packs above)
        env:
          REQUIRE_PACKS: javascript
          SKIP_BUILD: '1'
        run: npm run test:e2e

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.astro-docs-example-key }}


  svelte-course-example:
    name: Svelte course example
    needs: plan
    if: needs.plan.outputs.svelte-course-example-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: light/examples/svelte-course
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 22, as the JavaScript pack's build.sh is run with in the
      # javascript job.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: light/examples/svelte-course/package-lock.json

      # Its own playwright-core installs the Chromium the end-to-end test launches.
      - name: Install the example and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM=$(node -e "import('playwright-core').then((m) => console.log(m.chromium.executablePath()))")" >> "$GITHUB_ENV"

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Unit tests and bundle fixtures (the initial scripts' budget, Monaco and the languages lazy)
        run: npm test

      # The pack's npm cache, shared with the javascript job's.
      - uses: actions/cache@v6
        with:
          path: ${{ env.PACK_CACHE }}/javascript
          key: ci-javascript-${{ hashFiles('light/packs/javascript/package-lock.json') }}
          restore-keys: ci-javascript-

      - name: Build the JavaScript pack
        working-directory: light/packs/javascript
        run: ./build.sh

      # Only the JavaScript exercise runs; test.mjs names each one it skips.
      - name: End-to-end (Chromium, the JavaScript exercise)
        run: npm run test:e2e

      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.svelte-course-example-key }}

  exports:
    name: Download builds with ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.exports-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - c:cmake
          - cpp:cmake
          - cpp:meson
          - cpp:conan
          - python:pyproject
          - javascript:npm
          - typescript:npm
          - web:vite
          - swift:swiftpm
          - scala:sbt
          - rust:cargo
          - php:composer
          - java:maven
          - java:gradle
          - kotlin:gradle
          - kotlin:maven
          - haskell:cabal
          - haskell:stack
          - go:go
          - zig:zig
    defaults:
      run:
        working-directory: light/app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 24 loads export.ts and the packages it composes as they are,
      # without the app's dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run the download's CI
        env:
          TARGET: ${{ matrix.target }}
        run: node tests/export-ci.mjs "$TARGET"

  exports-done:
    name: Downloads build
    needs: [plan, exports]
    if: needs.plan.outputs.exports-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.exports-key }}
