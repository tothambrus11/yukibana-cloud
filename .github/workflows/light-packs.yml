# Builds every Yukibana Light language pack (light/packs/<pack>), each only
# when its sources changed since it was last built.
#
# A pack's output (light/app/static/packs/<pack>) is a function of its
# directory: build.sh pins every download by sha256 and every upstream
# release by tag, and reads nothing outside light/packs/<pack> but its own
# download cache. So each output that built and passed its tests is kept in
# the pack store (light/scripts/pack-store.sh): the asset
# <pack>-<git tree id of light/packs/<pack>>.tar.zst of the rolling
# prerelease "light-packs". A job whose tree already has an asset downloads
# it in seconds instead of building, so a push that touches the app or one
# pack rebuilds nothing, or that one pack, and a release rebuilds only what
# changed since. The store is a release rather than the Actions cache, whose
# 10 GB a single C++ build cache nearly fills (and evicts after a week
# unused), and `light/setup.sh` downloads from it too, without an account.
#
# A pack that does build runs its own build.sh exactly as its README says,
# on a clean ubuntu-24.04 runner, with the system packages its deps.apt
# lists and its download and compile cache ($PACK_CACHE) in the Actions
# cache, saved even when the build fails so a rerun resumes where it
# stopped. Every build.sh runs the pack's own tests, so a pack that changed
# is tested on the push that changed it, not first at release time. The C++
# pack compiles LLVM three times and QEMU: about three hours from nothing,
# minutes with its cache.
#
# Runs on pushes to main and on pull requests that touch a pack, and is
# called by light-release.yml with `upload: true`, which also uploads each
# pack's output as the artifact pack-<pack> for the release to assemble. A
# pull request's run writes to the store too, unless it comes from a fork.
# Without `upload`, a pack the store has is not even downloaded: its job
# checks that the asset exists and is done.
name: Yukibana Light packs

on:
  push:
    branches:
      - main
    paths:
      - light/packs/**
      - light/scripts/pack-store.sh
      - light/scripts/toolchain-env.sh
      - light/setup.sh
      - .github/workflows/light-packs.yml
      - .github/actions/once/**
  pull_request:
    paths:
      - light/packs/**
      - light/scripts/pack-store.sh
      - light/scripts/toolchain-env.sh
      - light/setup.sh
      - .github/workflows/light-packs.yml
      - .github/actions/once/**
  workflow_dispatch:
  workflow_call:
    inputs:
      upload:
        description: Upload each pack's output as the artifact pack-<pack>
        type: boolean
        default: false

# One run at a time per branch or pull request, the newest waiting (GitHub
# drops the ones in between): a run that builds a pack stores it, and the next
# run finds it there, rather than both building the same pack at once. The
# push to main and a pull request are separate queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.upload && 'upload' || 'check' }}
  cancel-in-progress: false

permissions:
  contents: write # the pack store's release
  actions: write # the Haskell pack's inputs (other runs' artifacts); pruning the build caches

env:
  PACK_CACHE: /home/runner/.cache/yukibana-packs
  JOBS: 4
  GH_TOKEN: ${{ github.token }}

jobs:
  # Whether the store job already passed on exactly its inputs
  # (.github/actions/once). The pack jobs need no such plan: the store is
  # theirs.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      store-done: ${{ steps.store.outputs.done }}
      store-key: ${{ steps.store.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: store
        uses: ./.github/actions/once
        with:
          name: light-pack-store
          paths: |
            light/scripts/pack-store.sh
            light/scripts/test-pack-store.mjs
            light/scripts/toolchain-env.sh
            light/setup.sh
            .github/workflows/light-packs.yml

  # The store's reading side, which every pack job below and setup.sh rely
  # on, tested against a stand-in for GitHub's API, before anything uses it.
  store:
    name: Pack store
    needs: plan
    if: needs.plan.outputs.store-done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: light
    steps:
      - uses: actions/checkout@v7
      - name: Lint the store and setup scripts
        run: shellcheck -x -S style scripts/pack-store.sh scripts/toolchain-env.sh setup.sh
      - name: Test the store
        run: node --test scripts/test-pack-store.mjs
      - uses: ./.github/actions/once
        with:
          record: ${{ needs.plan.outputs.store-key }}

  # After the store's tests, or once they are known to pass (skipped).
  pack:
    needs: [plan, store]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.store.result == 'success' || needs.store.result == 'skipped') }}
    name: Pack ${{ matrix.pack }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The system packages a pack needs are in its deps.apt.
          - pack: cpp
            timeout: 355
            free-disk: true
          - pack: haskell
            timeout: 60
          - pack: java
            timeout: 60
          - pack: javascript
            timeout: 30
          - pack: kotlin
            timeout: 20
          - pack: php
            timeout: 30
          - pack: python
            timeout: 60
          - pack: rust
            timeout: 90
            free-disk: true
          - pack: scala
            timeout: 90
            java: true
          - pack: swift
            timeout: 120
            free-disk: true
    defaults:
      run:
        working-directory: light/packs/${{ matrix.pack }}
    steps:
      - uses: actions/checkout@v7

      # HEAD's build of these sources, when the store has one (exit 3: none):
      # downloaded for a release, which assembles it; otherwise only looked
      # up, as nothing here reads it.
      - name: Look for the pack built from these sources
        id: output
        env:
          COMMAND: ${{ inputs.upload && 'fetch' || 'has' }}
        run: |
          status=0
          ../../scripts/pack-store.sh "$COMMAND" ${{ matrix.pack }} || status=$?
          case "$status" in
            0) echo "cache-hit=true" >> "$GITHUB_OUTPUT" ;;
            3) ;;
            *) exit "$status" ;;
          esac

      # Everything from here to "Put the output in the store" runs only for a
      # pack whose sources have no output in the store yet.
      - name: Free disk space
        if: steps.output.outputs.cache-hit != 'true' && matrix.free-disk
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Install build dependencies
        if: steps.output.outputs.cache-hit != 'true' && hashFiles(format('light/packs/{0}/deps.apt', matrix.pack)) != ''
        run: |
          sudo apt-get update -q
          grep -v '^#' deps.apt | xargs sudo apt-get install -y -q --no-install-recommends

      - uses: actions/setup-node@v7
        if: steps.output.outputs.cache-hit != 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        if: steps.output.outputs.cache-hit != 'true' && matrix.java
        with:
          distribution: temurin
          java-version: 21

      - name: Install uv
        if: steps.output.outputs.cache-hit != 'true' && matrix.pack == 'python'
        run: pipx install uv

      - name: Restore the pack's build cache
        id: cache
        if: steps.output.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.PACK_CACHE }}
            !${{ env.PACK_CACHE }}/swift/toolchain
          key: light-${{ matrix.pack }}-${{ hashFiles(format('light/packs/{0}/**', matrix.pack)) }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            light-${{ matrix.pack }}-${{ hashFiles(format('light/packs/{0}/**', matrix.pack)) }}-
            light-${{ matrix.pack }}-

      # The Haskell pack takes GHC's root file system and its tools (ormolu,
      # hlint) from the light-haskell-ghc.yml and light-haskell-ghc-tools.yml
      # runs its build.sh pins (ROOTFS_RUN, TOOLS_RUN). An artifact that has
      # expired (90 days) is not an error: build.sh then downloads the same
      # files from the release that keeps them (INPUTS_RELEASE in build.sh,
      # light-haskell-inputs-release.yml).
      - name: Haskell's inputs
        id: haskell
        if: steps.output.outputs.cache-hit != 'true' && matrix.pack == 'haskell'
        run: |
          echo "rootfs-run=$(sed -n 's/^ROOTFS_RUN=\([0-9][0-9]*\).*/\1/p' build.sh)" >> "$GITHUB_OUTPUT"
          echo "tools-run=$(sed -n 's/^TOOLS_RUN=\([0-9][0-9]*\).*/\1/p' build.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        id: rootfs-artifact
        if: steps.haskell.outputs.rootfs-run
        continue-on-error: true
        with:
          name: haskell-ghc-rootfs
          run-id: ${{ steps.haskell.outputs.rootfs-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/haskell-ghc-rootfs

      - uses: actions/download-artifact@v7
        id: tools-artifact
        if: steps.haskell.outputs.tools-run
        continue-on-error: true
        with:
          name: haskell-ghc-tools
          run-id: ${{ steps.haskell.outputs.tools-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/haskell-ghc-tools

      - name: Build and test
        id: build
        if: steps.output.outputs.cache-hit != 'true'
        run: ./build.sh
        env:
          HASKELL_GHC_ROOTFS: ${{ steps.rootfs-artifact.outcome == 'success' && format('{0}/haskell-ghc-rootfs', runner.temp) || '' }}
          HASKELL_GHC_TOOLS: ${{ steps.tools-artifact.outcome == 'success' && format('{0}/haskell-ghc-tools', runner.temp) || '' }}

      - name: Disk and cache usage
        if: always() && steps.output.outputs.cache-hit != 'true'
        run: |
          df -h /
          du -sh "$PACK_CACHE"/* 2>/dev/null || true

      # Saved also when the build failed or was cancelled, so the next run
      # does not start again from nothing.
      - name: Save the pack's build cache
        if: always() && steps.cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.PACK_CACHE }}
            !${{ env.PACK_CACHE }}/swift/toolchain
          key: light-${{ matrix.pack }}-${{ hashFiles(format('light/packs/{0}/**', matrix.pack)) }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The cache just saved holds everything the older ones of this pack do
      # (it was restored from the newest of them), so they go: the
      # repository's caches are capped at 10 GB, which the C++ pack's alone
      # nearly fills, and otherwise the packs' caches evict one another.
      - name: Delete the pack's older build caches
        if: always() && steps.cache.outcome == 'success'
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key "light-${{ matrix.pack }}-" --sort created_at --order desc \
            --limit 100 --json key --jq '.[1:][].key' |
            while read -r key; do gh cache delete "$key" --repo "$GITHUB_REPOSITORY"; done

      # Only an output that built and passed its tests goes in the store; a
      # pull request from a fork has no right to write it.
      - name: Put the output in the store
        if: >-
          steps.build.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: ../../scripts/pack-store.sh publish ${{ matrix.pack }}

      - name: Check the output
        env:
          STORED_ONLY: ${{ steps.output.outputs.cache-hit == 'true' && !inputs.upload }}
        run: |
          if [ "$STORED_ONLY" = true ]; then
            echo "${{ matrix.pack }}: in the store already" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -f "../../app/static/packs/${{ matrix.pack }}/server.js" ||
            { echo "::error::pack ${{ matrix.pack }} has no server.js" >&2; exit 1; }
          echo "${{ matrix.pack }}: $(du -sh "../../app/static/packs/${{ matrix.pack }}" | cut -f1)," \
            "${{ steps.output.outputs.cache-hit == 'true' && 'restored' || 'built' }}" >> "$GITHUB_STEP_SUMMARY"

      # The artifact's root is static/packs, so it holds <pack>/ and the
      # release can merge every pack into one static/packs.
      - uses: actions/upload-artifact@v6
        if: inputs.upload
        with:
          name: pack-${{ matrix.pack }}
          path: light/app/static/packs/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 3
