# The local Supabase stack, and what `supabase config push` sets on a linked
# project. Everything here is version controlled; secrets are env() references.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "yukibana"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# No grants by default: what an API role may read is what a migration granted
# it, and nothing more. The app itself never uses the Data API (see
# app/src/lib/server/db.ts); this keeps PostgREST honest for anyone who tries.
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
# Must match the linked project's `show server_version`.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
# Migrations are written by hand; there are no declarative schema files.
schema_paths = []

[db.seed]
enabled = true
# Local only: the pgTAP helpers, then fixture people and a course.
sql_paths = ["./seeds/*.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# Login is GitHub only; nothing sends mail.
[local_smtp]
enabled = false

# Files live in R2 (or RustFS locally) over S3, not in Supabase Storage.
[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback", "http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

# No password or magic-link path: the only way in is the provider below.
[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# GitHub is the identity provider. A GitHub OAuth App per environment; its
# callback URL is <auth url>/auth/v1/callback. See .env.example.
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

# Kept for the smoke test's health function, which proves the bind mount into
# the edge runtime works where the CLI runs. The app runs on Cloudflare.
[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
port = 54327
backend = "postgres"

# Per-project overrides for `supabase config push`. Everything above is the
# local stack; this is what production differs by. Replace the ref with the
# project's own, which is the first label of its API URL.
[remotes.production]
project_id = "REPLACE_ME_PROJECT_REF"

[remotes.production.auth]
site_url = "https://yukibana-cloud.REPLACE_ME_WORKERS_SUBDOMAIN.workers.dev"
additional_redirect_urls = ["https://yukibana-cloud.REPLACE_ME_WORKERS_SUBDOMAIN.workers.dev/auth/callback"]
