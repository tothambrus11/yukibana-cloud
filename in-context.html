<title>Buttons and accents in context</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Page chrome (the controls around the screens). */
:root {
  color-scheme: light dark;
  --bg: oklch(97.6% 0.0045 260); --surface: oklch(100% 0 0); --sunken: oklch(94.8% 0.0081 260);
  --ink: oklch(22% 0.0225 260); --soft: oklch(47% 0.018 260); --line: oklch(90% 0.009 260); --line-strong: oklch(63% 0.0135 260);
  --head: 'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: oklch(16.5% 0.0144 260); --surface: oklch(20% 0.0162 260); --sunken: oklch(25% 0.0171 260); --ink: oklch(94% 0.0072 260); --soft: oklch(73% 0.0144 260); --line: oklch(29% 0.018 260); --line-strong: oklch(54% 0.0216 260); }
}
:root[data-theme="dark"] { --bg: oklch(16.5% 0.0144 260); --surface: oklch(20% 0.0162 260); --sunken: oklch(25% 0.0171 260); --ink: oklch(94% 0.0072 260); --soft: oklch(73% 0.0144 260); --line: oklch(29% 0.018 260); --line-strong: oklch(54% 0.0216 260); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.wrap { padding: 20px 16px 64px; }
.intro h1 { font: 750 28px/1.15 var(--head); margin: 0 0 4px; letter-spacing: -0.01em; }
.intro p { color: var(--soft); margin: 0 0 12px; max-width: 760px; }
.globals { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 10px 12px; margin: 0 -4px 16px; background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.ctl > span.lab { color: var(--soft); font-weight: 600; margin-right: 2px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border-radius: 9px; background: var(--sunken); }
.seg button { font: 600 12.5px/1.2 var(--body); border: 0; background: transparent; color: var(--soft); padding: 5px 9px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.seg button:focus-visible, .chk:focus-within, textarea:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.seg i.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink); }
.status { color: var(--soft); font-size: 12.5px; margin-left: auto; }
section.screen { margin: 0 0 40px; }
.shead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 10px; }
.shead h2 { font: 750 20px/1.2 var(--head); margin: 0; min-width: 110px; }
.note { width: 100%; display: flex; gap: 8px; align-items: flex-start; }
.note textarea { flex: 1; min-height: 36px; resize: vertical; font: 13px/1.4 var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 10px; }
.frames { display: grid; gap: 14px; }
.frame { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-width: 100%; }
.frame > .scr { min-width: 1040px; }
.flabel { font-size: 12px; color: var(--soft); margin: 0 0 4px 2px; }

/* ============ The screens. Everything inside .scr is the design under review. ============ */
.scr {
  --s-bg: oklch(97.6% 0.0045 260); --s-surface: oklch(100% 0 0); --s-sunken: oklch(94.8% 0.0081 260); --s-rail: oklch(96.4% 0.0054 260);
  --s-ink: oklch(22% 0.0225 260); --s-soft: oklch(47% 0.018 260); --s-line: oklch(90% 0.009 260); --s-line-strong: oklch(63% 0.0135 260);
  --s-lattice: oklch(50% 0.03 260 / 0.28); --s-code: oklch(96.6% 0.0063 260); --s-bar: oklch(93.5% 0.009 260);
  --k-kw: oklch(48% 0.16 300); --k-fn: oklch(46% 0.13 245); --k-str: oklch(46% 0.1 165); --k-num: oklch(52% 0.13 55);
  --chip-l: 0.935; --chip-c: 0.045; --chipf-l: 0.38; --chipf-c: 0.1;
  --danger: oklch(52% 0.17 25); --toast: oklch(22% 0.0225 260); --on-toast: oklch(97.6% 0.0045 260);
  --a: var(--aL); --a-s: var(--aLs); --a-bg: var(--aLbg); --a-tx: var(--aLtx); --a-on: oklch(99% 0 0);
  --fvs: normal;
  position: relative; background: var(--s-bg); color: var(--s-ink); font: 15px/1.55 var(--body); color-scheme: light;
}
.scr.dk {
  --s-bg: oklch(16.5% 0.0144 260); --s-surface: oklch(20% 0.0162 260); --s-sunken: oklch(25% 0.0171 260); --s-rail: oklch(18.5% 0.0153 260);
  --s-ink: oklch(94% 0.0072 260); --s-soft: oklch(73% 0.0144 260); --s-line: oklch(29% 0.018 260); --s-line-strong: oklch(54% 0.0216 260);
  --s-lattice: oklch(80% 0.03 260 / 0.16); --s-code: oklch(18% 0.0153 260); --s-bar: oklch(15% 0.0135 260);
  --k-kw: oklch(78% 0.12 305); --k-fn: oklch(80% 0.1 240); --k-str: oklch(82% 0.1 165); --k-num: oklch(82% 0.11 65);
  --chip-l: 0.3; --chip-c: 0.06; --chipf-l: 0.88; --chipf-c: 0.07;
  --danger: oklch(72% 0.15 25); --toast: oklch(94% 0.0072 260); --on-toast: oklch(17% 0.018 260);
  --a: var(--aD); --a-s: var(--aDs); --a-bg: var(--aDbg); --a-tx: var(--aDtx); --a-on: oklch(17% 0.018 260);
  color-scheme: dark;
}
.scr h1, .scr h2, .scr h3, .scr .brand { font-family: var(--head); font-variation-settings: var(--fvs); letter-spacing: -0.02em; }
.scr a { color: var(--a-tx); text-underline-offset: 2px; }
.scr :focus-visible { outline: 2px solid var(--s-ink); outline-offset: 2px; }
.scr code, .scr kbd, .scr pre { font-family: var(--mono); font-variant-ligatures: none; }
.scr svg.i { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.lattice {
  background-color: var(--s-rail);
  background-image: linear-gradient(60deg, transparent 49.3%, var(--s-lattice) 49.3% 50.7%, transparent 50.7%), linear-gradient(-60deg, transparent 49.3%, var(--s-lattice) 49.3% 50.7%, transparent 50.7%), linear-gradient(0deg, transparent 48%, var(--s-lattice) 48% 52%, transparent 52%);
  background-size: 28px 48.5px;
}

/* Buttons: the six styles still in the running. */
.b { display: inline-flex; align-items: center; gap: 6px; font: 700 13px/1.2 var(--body); padding: 6px 13px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--s-ink); background: transparent; transition: background-color 120ms cubic-bezier(.2,0,0,1); }
.b.p { background: var(--a); color: var(--a-on); }
.b.p:hover { background: var(--a-s); }
.b.s { background: var(--s-surface); color: var(--s-ink); border-color: var(--s-line-strong); }
.b.s:hover, .b.g:hover { background: var(--s-sunken); }
.b.g { color: var(--s-soft); }
.b.big { font-size: 14.5px; padding: 9px 18px; }
.b .opt { display: none; }
.scr.v-icon .b .opt { display: inline; }
.b svg.i { width: 14px; height: 14px; stroke-width: 1.75; }
.b.big svg.i { width: 16px; height: 16px; }
.scr.v-r8 .b { border-radius: 8px; }
.scr.v-r6 .b { border-radius: 6px; font-weight: 600; padding: 6px 12px; }
.scr.v-r6 .b.big, .scr.v-r8 .b.big { padding: 9px 17px; }
.scr.v-edged .b.p { border-color: color-mix(in oklch, var(--a) 70%, black); }
.scr.v-edged.dk .b.p { border-color: color-mix(in oklch, var(--a) 70%, white); }
.scr.v-tonal .b.s { background: var(--a-bg); color: var(--a-tx); border-color: transparent; }
.scr.v-tonal .b.s:hover { background: color-mix(in oklch, var(--a-bg) 80%, var(--a)); }
.scr.v-icon .b { padding-left: 11px; }
.ib { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; color: var(--s-soft); border: 0; background: transparent; cursor: pointer; }
.ib:hover { background: var(--s-sunken); color: var(--s-ink); }
.ib svg { width: 17px; height: 17px; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/1.3 var(--body); padding: 2px 9px; border-radius: 999px; background: oklch(var(--chip-l) var(--chip-c) var(--h, 260)); color: oklch(var(--chipf-l) var(--chipf-c) var(--h, 260)); white-space: nowrap; }
.chip svg.i { width: 12px; height: 12px; stroke-width: 2; }
.chip.grey { --chip-c: 0.006; --chipf-c: 0.01; }

/* The header (round 13). */
.hdr { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; padding: 8px 16px; background: color-mix(in oklch, var(--s-surface) 82%, transparent); backdrop-filter: blur(14px) saturate(1.4); border-bottom: 1px solid var(--s-line); position: relative; z-index: 3; }
.hdr .sb { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hdr .sb img { width: 24px; height: 24px; }
.hdr .brand { font-weight: 650; font-size: 16px; color: var(--s-ink); text-decoration: none; }
.hdr nav { display: flex; gap: 4px; font-size: 13.5px; }
.hdr nav a { padding: 4px 10px; border-radius: 7px; color: var(--s-soft); text-decoration: none; }
.hdr nav a:hover { color: var(--s-ink); background: var(--s-sunken); }
.hdr .se { display: flex; align-items: center; justify-content: flex-end; gap: 10px; min-width: 0; }
.search { display: flex; flex: 0 1 200px; align-items: center; gap: 8px; min-width: 0; padding: 5px 10px; border: 1px solid var(--s-line); border-radius: 10px; background: var(--s-sunken); color: var(--s-soft); font: 13px/1.4 var(--body); }
.search kbd { margin-left: auto; padding: 0 5px; border: 1px solid var(--s-line); border-radius: 5px; background: var(--s-surface); font-size: 11px; }
.hdr.float { max-width: 1000px; margin: 0 auto; padding: 8px 10px 8px 14px; border: 1px solid var(--s-line); border-radius: 16px; box-shadow: inset 0 1px 0 color-mix(in oklch, var(--s-surface) 60%, transparent), 0 10px 30px -18px oklch(20% 0.03 260 / 0.45); }
.scr.dk .hdr.float { box-shadow: inset 0 1px 0 oklch(100% 0 0 / 0.06), 0 10px 30px -14px oklch(0% 0 0 / 0.7); }
.hdr.float nav { gap: 2px; padding: 3px; border-radius: 10px; background: var(--s-sunken); }
.hdr.float nav a { padding: 3px 12px; }
.hdr.float nav a:hover { background: var(--s-surface); }

/* ---------- Landing ---------- */
.land .top { position: absolute; inset: 12px 16px auto; z-index: 4; }
.land .hero { position: relative; overflow: hidden; padding: 112px 24px 64px; display: grid; place-items: center; text-align: center; border-bottom: 1px solid var(--s-line); }
.land .hero .bg { position: absolute; inset: 0; -webkit-mask: radial-gradient(closest-side, transparent 58%, #000); mask: radial-gradient(closest-side, transparent 58%, #000); }
.land .hero .in { position: relative; max-width: 640px; }
.land .hero img { width: 88px; height: 88px; }
.land .hero h1 { font-size: 52px; line-height: 1.04; font-weight: 750; margin: 6px 0 12px; }
.land .hero p { font-size: 18px; color: var(--s-soft); margin: 0 auto 22px; max-width: 540px; }
.land .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
.land .why { max-width: 760px; margin: 0 auto; padding: 48px 24px 8px; }
.land h2 { font-size: 30px; font-weight: 750; margin: 0 0 10px; }
.land .why p { color: var(--s-soft); font-size: 16.5px; margin: 0; }
.land .feat { max-width: 1000px; margin: 0 auto; padding: 28px 24px 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.land .fc { background: var(--s-surface); border: 1px solid var(--s-line); border-radius: 12px; padding: 18px; }
.land .fc svg.i { width: 22px; height: 22px; color: var(--a-tx); }
.land .fc b { display: block; font: 700 16px/1.3 var(--head); letter-spacing: -0.01em; margin: 8px 0 4px; font-variation-settings: var(--fvs); }
.land .fc p { margin: 0; color: var(--s-soft); font-size: 14px; }
.land .demo { max-width: 1000px; margin: 0 auto; padding: 36px 24px 8px; display: grid; grid-template-columns: 1fr 1.25fr; gap: 28px; align-items: center; }
.land .demo p { color: var(--s-soft); margin: 0 0 16px; }
.land .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.land .foot { margin-top: 48px; border-top: 1px solid var(--s-line); padding: 22px 24px; display: flex; gap: 18px; align-items: center; color: var(--s-soft); font-size: 13px; }
.land .foot a { color: var(--s-soft); text-decoration: none; }

/* Code frame: Light's dock tab bar on top of the code. */
.cf { border: 1px solid var(--s-line); border-radius: 8px; overflow: hidden; background: var(--s-code); }
.tabs { display: flex; align-items: stretch; background: var(--s-bar); border-bottom: 1px solid var(--s-line); min-height: 34px; }
.tab { position: relative; display: flex; align-items: center; gap: 6px; padding: 0 14px; font: 13px/1 var(--body); color: var(--s-soft); white-space: nowrap; }
.tab + .tab::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 1px; background: var(--s-line); }
.tab.on { background: var(--s-code); color: var(--s-ink); }
.tab.on + .tab::before, .tab.on::before { display: none; }
.tab.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--s-line-strong); }
.group.focus .tab.on::after { background: var(--a); }
.tabs .sp { flex: 1; }
.tabs .ib { width: 26px; height: 26px; align-self: center; margin-right: 5px; }
.tabs .ib svg { width: 15px; height: 15px; }
pre.code { margin: 0; padding: 12px 0; font-size: 13px; line-height: 1.6; color: var(--s-ink); overflow: hidden; }
pre.code > span { display: block; min-height: 1.6em; }
pre.code .ln { display: inline-block; width: 38px; padding-right: 12px; text-align: right; color: var(--s-soft); opacity: .7; user-select: none; }
.kw { color: var(--k-kw); } .fn { color: var(--k-fn); } .st { color: var(--k-str); } .nu { color: var(--k-num); } .cm { color: var(--s-soft); font-style: italic; }

/* ---------- Cloud ---------- */
.cloud .crumb { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.cloud .course { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; border-radius: 8px; border: 1px solid var(--s-line); background: var(--s-surface); font-weight: 600; }
.cloud .course svg.i { width: 14px; height: 14px; color: var(--s-soft); }
.cloud .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--body); background: oklch(var(--chip-l) var(--chip-c) 300); color: oklch(var(--chipf-l) var(--chipf-c) 300); }
.cloud .hdr { grid-template-columns: 1fr auto; }
.cloud .main { max-width: 1040px; margin: 0 auto; padding: 22px 24px 76px; }
.cloud .ttl { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
.cloud h1 { font-size: 28px; font-weight: 750; margin: 0; line-height: 1.15; }
.cloud .sub { color: var(--s-soft); font-size: 14px; margin: 2px 0 0; }
.ul { display: flex; gap: 2px; border-bottom: 1px solid var(--s-line); margin: 18px 0 16px; }
.ul a { position: relative; padding: 8px 12px 10px; color: var(--s-soft); text-decoration: none; font-size: 14px; display: grid; }
.ul a::before { content: attr(data-t); font-weight: 700; visibility: hidden; height: 0; grid-area: 1/1; }
.ul a span { grid-area: 1/1; }
.ul a.on { color: var(--s-ink); font-weight: 700; }
.ul a.on::after { content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--a); }
.ul .n { color: var(--s-soft); font-weight: 400; font-size: 12px; margin-left: 4px; }
.cloud .grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 20px; align-items: start; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.field { display: flex; align-items: center; gap: 8px; flex: 1; padding: 6px 10px; border: 1px solid var(--s-line-strong); border-radius: 8px; background: var(--s-surface); color: var(--s-soft); font-size: 14px; }
.bulk { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 6px 8px 6px 14px; border: 1px solid var(--s-line-strong); border-radius: 999px; background: var(--s-surface); font-size: 13.5px; }
.bulk b { margin-right: auto; }
.bulk .b.danger { color: var(--danger); }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--s-surface); border: 1px solid var(--s-line); border-radius: 12px; overflow: hidden; font-size: 14px; }
.t th, .t td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--s-line); }
.t tr:last-child td { border-bottom: 0; }
.t th { font-size: 12px; color: var(--s-soft); font-weight: 600; }
.t td.c, .t th.c { width: 1%; padding-right: 0; }
.t tbody tr:hover { background: var(--s-sunken); cursor: pointer; }
.t tbody tr.sel { background: var(--a-bg); }
.t td .m { color: var(--s-soft); font-size: 13px; }
.t td b { font-weight: 700; }
.ck { appearance: none; width: 16px; height: 16px; margin: 0; border-radius: 4px; border: 1px solid var(--s-line-strong); background: var(--s-surface); display: grid; place-items: center; cursor: pointer; vertical-align: middle; }
.ck:checked { background: var(--a); border-color: var(--a); }
.ck:checked::after { content: ''; width: 8px; height: 4px; border: solid var(--a-on); border-width: 0 0 2px 2px; rotate: -45deg; translate: 0 -1px; }
.card { background: var(--s-surface); border: 1px solid var(--s-line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.card p { margin: 0 0 12px; color: var(--s-soft); font-size: 13.5px; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; }
.kv dt { color: var(--s-soft); }
.kv dd { margin: 0; }
.kv code { font-size: 12.5px; background: var(--s-sunken); padding: 1px 5px; border-radius: 5px; }
.toast { position: absolute; left: 50%; bottom: 18px; translate: -50% 0; display: flex; gap: 8px; align-items: center; width: max-content; padding: 8px 14px; border-radius: 999px; background: var(--toast); color: var(--on-toast); font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px -12px oklch(0% 0 0 / .5); z-index: 5; }
.toast svg.i { color: var(--on-toast); }

/* ---------- Light ---------- */
.light { display: grid; grid-template-rows: auto 1fr auto; height: 600px; }
.light .tb { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--s-surface); border-bottom: 1px solid var(--s-line); }
.light .tb .sb { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.light .tb img { width: 22px; height: 22px; }
.light .tb .brand { font-weight: 650; font-size: 15px; }
.light .tb .brand small { font-family: var(--body); font-weight: 400; color: var(--s-soft); font-size: 13px; letter-spacing: 0; margin-left: 4px; }
.light .sel { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 10px; border: 1px solid var(--s-line-strong); border-radius: 8px; background: var(--s-surface); font-size: 13px; }
.light .sel svg.i { width: 13px; height: 13px; color: var(--s-soft); }
.light .tb .sp { flex: 1; }
.light .dock { display: grid; grid-template-columns: 1.35fr 1fr; min-height: 0; background: var(--s-line); gap: 1px; }
.light .group { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--s-code); }
.light .group pre.code { overflow: hidden; }
.light .out { padding: 10px 14px; font: 13px/1.6 var(--mono); color: var(--s-ink); }
.light .out .ok { color: var(--k-str); }
.light .out .dim { color: var(--s-soft); }
.light .split { display: grid; grid-template-rows: 1fr 1fr; gap: 1px; background: var(--s-line); min-height: 0; }
.light .stbar { display: flex; gap: 16px; align-items: center; padding: 4px 12px; font-size: 12px; color: var(--s-soft); background: var(--s-surface); border-top: 1px solid var(--s-line); }
.light .stbar .chip { font-size: 11px; padding: 1px 8px; }
.light .asm { padding: 10px 0; font: 12.5px/1.6 var(--mono); }
.light .asm div { padding: 0 14px; }

        ${rows.map(r => `<tr class="${r[6] ? 'sel' : ''}"><td class="c"><input class="ck" type="checkbox" ${r[6] ? 'checked' : ''} aria-label="Select ${r[0]}"></td><td><b>${r[0]}</b> <span class="chip" style="--h:${r[2]};margin-left:6px">${r[1]}</span></td><td>${chip(r[3])}</td><td class="m">${r[4]}</td><td class="m">${r[5]}</td></tr>`).join('')}
        </tbody></table>

        <div class="card"><h3>Edition</h3><dl class="kv"><dt>Repository</dt><dd><code>heig/prog1</code></dd><dt>Release</dt><dd>v2026.11.3</dd><dt>Language</dt><dd>C++, Rust</dd></dl></div>
      </aside>
    </div>
  </div>
  <div class="toast">${I.check}Due date extended for 2 projects</div>
</div>`;
}
function light() {
  return `<div class="light">
  <div class="tb"><span class="sb"><img src="${LOGO}" alt=""><span class="brand">Yukibana <small>Light</small></span></span><span class="sel">C++ 23 · clang 21${I.chev}</span><span class="sel">x86_64 Linux${I.chev}</span><span class="sp"></span><a class="b s" href="#"><span class="opt">${I.share}</span>Share</a><a class="b s" href="#"><span class="opt">${I.dl}</span>Download</a><a class="b p" href="#">${I.play}Run</a></div>
  <div class="dock">
    <div class="group focus"><div class="tabs"><span class="tab on">main.cpp</span><span class="tab">words.txt</span><span class="tab">CMakeLists.txt</span><span class="sp"></span></div>${code(CPP, true)}</div>
    <div class="split">
      <div class="group"><div class="tabs"><span class="tab on">Assembly</span><span class="tab">LLVM IR</span><span class="sp"></span></div><div class="asm"><div><span class="fn">main</span>:</div><div>  push rbp</div><div>  mov  rbp, rsp</div><div class="hl">  lea  rdi, [rip + std::cin]</div><div class="hl">  call operator&gt;&gt;</div><div>  test rax, rax</div><div>  je   .LBB0_3</div><div>  inc  dword ptr [rbp - 4]</div></div></div>
      <div class="group"><div class="tabs"><span class="tab on">Output</span><span class="tab">Problems <span class="chip grey" style="font-size:10.5px;padding:0 6px">0</span></span><span class="sp"></span></div><div class="out"><div class="dim">$ ./main &lt; words.txt</div><div>words: 1284</div><div class="ok">✓ exited with 0 in 41 ms</div></div></div>
    </div>
  </div>
  <div class="stbar"><span class="chip" style="--h:160">${I.check}Built</span><span>Ln 8, Col 12</span><span>UTF-8</span><span style="margin-left:auto">Runs in your browser</span></div>
</div>`;
}
const BUILD = { landing, cloud, light };

/* ---------- State ---------- */
const DEF = { style: 'current', accent: 'green', theme: 'light', note: '' };
let state = { font: 'auto', link: false, screens: { landing: { ...DEF }, cloud: { ...DEF }, light: { ...DEF } } };
let doc = null, saveTimer = null;
function clone(v) { return JSON.parse(JSON.stringify(v)); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function setStatus(s) { document.getElementById('status').textContent = s; }

function seg(id, items, cur, extra) {
  return `<div class="seg" data-ctl="${id}">${items.map(it => `<button type="button" data-v="${it.id}" aria-pressed="${it.id === cur}">${extra ? extra(it) : ''}${esc(it.name)}</button>`).join('')}</div>`;
}
function frame(sc, dark) {
  const st = state.screens[sc.id];
  const style = STYLES.find(s => s.id === st.style) ?? STYLES[0];
  const acc = ACCENTS.find(a => a.id === st.accent) ?? ACCENTS[0];
  const fvs = (FONTS.find(f => f.id === state.font) ?? FONTS[0]).fvs;
  return `<div><div class="flabel">${dark ? 'Dark' : 'Light'} theme</div><div class="frame"><div class="scr ${dark ? 'dk' : ''} ${style.cls}" style="${accentVars(acc)};--fvs:${fvs}">${BUILD[sc.id]()}</div></div></div>`;
}
function render() {
  document.getElementById('g-font').outerHTML = seg('font', FONTS, state.font).replace('class="seg"', 'class="seg" id="g-font"');
  document.getElementById('g-link').checked = !!state.link;
  const host = document.getElementById('screens');
  const focused = document.activeElement && document.activeElement.tagName === 'TEXTAREA' ? document.activeElement.dataset.note : null;
  host.innerHTML = SCREENS.map(sc => {
    const st = state.screens[sc.id];
    const frames = st.theme === 'both' ? frame(sc, false) + frame(sc, true) : frame(sc, st.theme === 'dark');
    return `<section class="screen" data-screen="${sc.id}"><div class="shead"><h2>${sc.name}</h2>
      <div class="ctl"><span class="lab">Buttons</span>${seg('style', STYLES, st.style)}</div>
      <div class="ctl"><span class="lab">Accent</span>${seg('accent', ACCENTS, st.accent, a => `<i class="dot" style="background:oklch(0.5 ${a.c} ${a.h})"></i>`)}</div>
      <div class="ctl"><span class="lab">Theme</span>${seg('theme', THEMES, st.theme)}</div>
      <div class="note"><textarea data-note="${sc.id}" rows="1" placeholder="Notes on ${sc.name.toLowerCase()} (optional)">${esc(st.note || '')}</textarea></div>
    </div><div class="frames">${frames}</div></section>`;
  }).join('');
  if (focused) { const t = host.querySelector(`textarea[data-note="${focused}"]`); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
}
async function save(now) {
  if (!doc) return;
  clearTimeout(saveTimer);
  const go = async () => { try { await doc.set(clone(state)); setStatus('Saved'); } catch (e) { setStatus('Could not save: ' + (e?.message ?? e)); } };
  if (now) await go(); else saveTimer = setTimeout(go, 600);
}
document.addEventListener('click', e => {
  const b = e.target.closest('.seg button'); if (b) {
    const ctl = b.closest('.seg').dataset.ctl, v = b.dataset.v;
    if (ctl === 'font') state.font = v;
    else {
      const sid = b.closest('section.screen').dataset.screen;
      const ids = state.link && ctl !== 'theme' ? SCREENS.map(s => s.id) : [sid];
      for (const id of ids) state.screens[id][ctl] = v;
    }
    render(); save(true); return;
  }
  if (e.target.closest('.scr a, .scr button')) e.preventDefault();
});
document.addEventListener('change', e => {
  if (e.target.id === 'g-link') { state.link = e.target.checked; save(true); }
  else if (e.target.classList?.contains('ck')) { const tr = e.target.closest('tr'); if (tr && tr.parentElement.tagName === 'TBODY') tr.classList.toggle('sel', e.target.checked); }
});
document.addEventListener('input', e => {
  const t = e.target.closest('textarea[data-note]'); if (!t) return;
  state.screens[t.dataset.note].note = t.value; setStatus('Saving…'); save(false);
});

render();
(async () => {
  const db = await window.claude?.use?.('db');
  if (!db) { setStatus('Not saving here: choices stay in this tab.'); return; }
  doc = db.doc('context/picks');
  doc.onSnapshot(s => {
    if (s.exists) {
      const d = clone(s.data() ?? {});
      const next = { font: typeof d.font === 'string' ? d.font : 'auto', link: !!d.link, screens: {} };
      for (const sc of SCREENS) {
        const x = (d.screens && d.screens[sc.id]) || {};
        next.screens[sc.id] = { style: typeof x.style === 'string' ? x.style : DEF.style, accent: typeof x.accent === 'string' ? x.accent : DEF.accent, theme: typeof x.theme === 'string' ? x.theme : DEF.theme, note: typeof x.note === 'string' ? x.note : '' };
      }
      // Don't clobber a note being typed in this tab.
      const typing = document.activeElement?.dataset?.note;
      if (typing) next.screens[typing].note = state.screens[typing].note;
      state = next;
    }
    setStatus('Saved');
    render();
  }, err => setStatus('Not connected: ' + (err?.message ?? err)));
})();
</script>
